<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Handball Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-dark:#1A2D3D;--bg-panel:#1E3448;--bg-header:#2B5876;--bg-header-light:#4E8098;--accent:#CC3333;--accent-dark:#A02020;--teal:#3A5A6A;--teal-light:#4A7A8A;--green:#27AE60;--gold:#F0C040;--white:#FFF;--text-primary:#F0F4F7;--text-secondary:#9AABB8;--text-muted:#6A8090;--border:#2A4A5A;--row-even:rgba(26,48,64,.95);--row-odd:rgba(30,58,76,.95);--score-bg:#0E1E2A}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}
.ov{position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none;display:flex;align-items:center;justify-content:center}
/* ══════════════ BROADCAST MOTION SYSTEM ══════════════ */
@keyframes splitOpen{0%{clip-path:inset(0 50% round 14px);opacity:0;transform:scale(.985)}30%{opacity:1}100%{clip-path:inset(0 0% round 14px);opacity:1;transform:scale(1)}}
@keyframes splitClose{0%{opacity:1;transform:scaleY(1) scaleX(1)}45%{opacity:1;transform:scaleY(.05) scaleX(1)}100%{opacity:0;transform:scaleY(.05) scaleX(.12)}}
@keyframes splitOpenGF{0%{clip-path:inset(0 50% round 10px);opacity:0}30%{opacity:1}100%{clip-path:inset(0 0% round 10px)}}
@keyframes morphOut{to{opacity:0;transform:translateY(14px) scale(.988)}}
@keyframes morphIn{from{opacity:0;transform:translateY(-14px) scale(.988)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeRow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0}to{opacity:1}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes sweepX{from{transform:translateX(-160%) skewX(-18deg)}to{transform:translateX(280%) skewX(-18deg)}}
@keyframes scorePop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gfGlow{0%,100%{box-shadow:0 6px 40px rgba(0,0,0,.6)}50%{box-shadow:0 6px 40px rgba(0,0,0,.6),0 0 34px rgba(240,192,64,.26)}}
@keyframes logoReveal{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes vsPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes cellPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes dotPulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.8)}}
@keyframes bgDrift{0%{transform:translate3d(-1.5%,-1.5%,0)}50%{transform:translate3d(1.5%,1.5%,0)}100%{transform:translate3d(-1.5%,-1.5%,0)}}
@keyframes fireFlicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}
.ac{animation:splitOpen .65s cubic-bezier(.22,1,.36,1) forwards}
.au{animation:splitOpenGF .6s cubic-bezier(.22,1,.36,1) forwards,gfGlow 1.4s ease-in-out .75s 1}
.ao{animation:splitClose .5s cubic-bezier(.55,0,.78,.36) forwards}
.amo{animation:morphOut .24s cubic-bezier(.55,0,.78,.36) forwards}
.ami{animation:morphIn .32s cubic-bezier(.22,1,.36,1) forwards}
.arow{opacity:0;animation:fadeRow .4s ease forwards}
.abar{transform-origin:left;animation:barGrow .6s cubic-bezier(.22,1,.36,1) forwards}
.adraw{stroke-dashoffset:var(--len);animation:drawLine 4s cubic-bezier(.22,1,.36,1) forwards}
.acell{animation:cellPop .4s cubic-bezier(.22,1,.36,1) forwards}
.dot-pulse{transform-box:fill-box;transform-origin:center;animation:dotPulse2 .9s ease-in-out 1}
.fire{display:inline-block;animation:fireFlicker 1.2s ease-in-out infinite}
.sweep{overflow:hidden}
.sph.sweep,.pmh.sweep,.pre-top.sweep{position:relative}
.sweep::after{content:'';position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-160%) skewX(-18deg);animation:sweepX 1s cubic-bezier(.4,0,.2,1) .55s 1 forwards;pointer-events:none}
.spop{animation:scorePop .3s cubic-bezier(.34,1.3,.5,1) .55s 1}
.sp,.pm,.pre{position:relative}
.sp::before,.pm::before,.pre::before{content:'';position:absolute;inset:-8%;background:radial-gradient(60% 80% at 18% 8%,rgba(78,128,152,.10),transparent 60%),radial-gradient(50% 70% at 86% 92%,rgba(204,51,51,.07),transparent 60%);animation:bgDrift 22s ease-in-out infinite;pointer-events:none;z-index:0;will-change:transform}
.sp::after,.pm::after,.pre::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>");opacity:.028;pointer-events:none;z-index:0}
.sp>*,.pm>*,.pre>*{position:relative;z-index:1}
.gf .gft,.gf .gfp,.gf .gfsc{opacity:0}
.gf .gft{animation:fadeRow .32s ease .22s forwards}
.gf .gfp{animation:fadeRow .32s ease .42s forwards}
.gf .gfsc{animation:fadeRow .32s ease .58s forwards,scorePop .3s cubic-bezier(.34,1.3,.5,1) .95s 1}
.pre .pre-logo{opacity:0;animation:logoReveal .55s cubic-bezier(.22,1,.36,1) .3s forwards}
.pre .pre-tname{opacity:0;animation:fadeRow .45s ease .58s forwards}
.pre .pre-vsx{opacity:0;animation:vsPop .5s cubic-bezier(.34,1.4,.5,1) .78s forwards}
.pre .pre-foot .pre-fi{opacity:0;animation:fadeRow .45s ease 1s forwards}
.pm .pm-logo{opacity:0;animation:logoReveal .5s cubic-bezier(.22,1,.36,1) .3s forwards}
.pm .pmnr{opacity:0;animation:fadeRow .4s ease .45s forwards}
.pm .pmn{opacity:0;animation:fadeRow .4s ease .58s forwards}
.pm .pmt{opacity:0;animation:fadeRow .4s ease .7s forwards}
.pm .pmsi{opacity:0;animation:fadeRow .4s ease forwards}
.pm .pmsi:nth-child(1){animation-delay:.82s}
.pm .pmsi:nth-child(2){animation-delay:.92s}
.pm .pmsi:nth-child(3){animation-delay:1.02s}

.sp{width:1700px;max-height:1040px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 10px 60px rgba(0,0,0,.7)}
.sph{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--accent),var(--accent-dark));padding:14px 36px}
.spt{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.spu{font-family:'Barlow';font-size:32px;color:rgba(255,255,255,.85);font-weight:600}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 36px;background:var(--bg-panel);border-bottom:2px solid var(--border)}
.tside{display:flex;align-items:center;gap:14px}
.tside.r{justify-content:flex-end}
.tn{font-family:'Oswald';font-size:38px;font-weight:700;color:var(--text-primary);text-transform:uppercase}
.ts{font-family:'Oswald';font-size:64px;font-weight:700;color:var(--white);text-align:center;background:var(--score-bg);border-radius:8px;padding:4px 36px;line-height:1.1}

.gf{position:absolute;bottom:100px;left:0;right:0;display:flex;align-items:stretch;height:90px;border-radius:10px;overflow:hidden;box-shadow:0 6px 40px rgba(0,0,0,.6);width:fit-content;margin:0 auto}
.gft{background:var(--accent);display:flex;align-items:center;padding:0 28px;font-family:'Oswald';font-size:32px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.gfp{background:var(--bg-dark);display:flex;align-items:center;gap:16px;padding:0 32px}
.gfn{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--gold)}
.gfnm{font-family:'Barlow Condensed';font-size:28px;font-weight:600;color:var(--text-primary)}
.gfd{font-family:'Barlow';font-size:20px;color:var(--text-secondary)}
.gfsc{background:var(--score-bg);display:flex;align-items:center;padding:0 28px;font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white)}

.scs{padding:8px 36px 18px}
.scl{font-family:'Oswald';font-size:30px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:10px 0 6px;display:flex;align-items:center;gap:10px}
.scr{display:grid;grid-template-columns:60px 1fr 120px 90px;align-items:center;padding:14px 20px;border-radius:6px;margin-bottom:4px}
.scr:nth-child(odd){background:var(--row-odd)}.scr:nth-child(even){background:var(--row-even)}
.scn{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-muted);text-align:center}
.scnm{font-family:'Barlow Condensed';font-size:32px;font-weight:600;color:var(--text-primary)}
.scg{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--gold);text-align:center}
.sce{font-family:'Barlow';font-size:26px;color:var(--text-secondary);text-align:center}

.gks{padding:10px 36px 14px}
.gks-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.gks-col-label{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.gks-col-label img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.gkc2{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--bg-panel);border-radius:8px;border:1px solid var(--border);margin-bottom:8px}
.gkc2-pct{font-family:'Oswald';font-size:48px;font-weight:700;color:var(--green);min-width:90px;text-align:center}
.gkc2-info{flex:1;min-width:0}
.gkc2-name{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gkc2-det{font-family:'Barlow';font-size:22px;color:var(--text-secondary)}
.gkc2-bars{flex:1;min-width:0}
.gkb2{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.gkb2-l{font-family:'Barlow';font-size:20px;color:var(--text-muted);width:40px;text-align:right;flex-shrink:0}
.gkb2-track{flex:1;height:18px;background:var(--row-even);border-radius:3px;overflow:hidden}
.gkb2-fill{height:100%;border-radius:3px;min-width:1px}.gkb2-fill.h{background:var(--teal-light)}.gkb2-fill.a{background:var(--accent)}
.gkb2-v{font-family:'Barlow';font-size:18px;font-weight:700;color:var(--text-secondary);width:44px;flex-shrink:0}

.shg{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:14px 36px 18px}
.sht{background:var(--bg-panel);border-radius:10px;padding:18px 20px;border:1px solid var(--border)}
.shtn{font-family:'Oswald';font-size:30px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px}
.shtn img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.zr{display:grid;grid-template-columns:140px 1fr 140px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.zn{font-family:'Barlow Condensed';font-size:28px;font-weight:600;color:var(--text-secondary)}
.zb{height:20px;background:var(--row-even);border-radius:4px;overflow:hidden}
.zf{height:100%;border-radius:4px;min-width:2px}.zf.h{background:var(--bg-header-light)}.zf.a{background:var(--accent)}
.zv{font-family:'Barlow Condensed';font-size:28px;font-weight:700;color:var(--text-primary);text-align:right}
/* Shot outcomes: wider label column, colored dots */
.zr.out{grid-template-columns:200px 1fr 140px}
.out-dot{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:10px;vertical-align:middle}
.out-stack{display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.out-stack>div{height:100%}
.out-total{font-family:'Barlow';font-size:22px;color:var(--text-muted);margin-bottom:8px}

/* Momentum overlay */
.mo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:18px 36px 10px}
.mo-card{background:var(--bg-panel);border-radius:12px;border:1px solid var(--border);padding:24px 28px;text-align:center}
.mo-team{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-primary);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.mo-lbl{font-family:'Barlow';font-size:20px;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.mo-run{font-family:'Oswald';font-size:80px;font-weight:700;color:var(--gold);line-height:1}
.mo-time{font-family:'Barlow';font-size:24px;color:var(--text-secondary);margin-top:8px}
.mo-cur{margin:6px 36px 20px;padding:16px 28px;background:linear-gradient(90deg,rgba(240,192,64,.12),rgba(240,192,64,.04));border:1px solid rgba(240,192,64,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:16px}
.mo-cur-txt{font-family:'Oswald';font-size:34px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px}

.pm{width:1500px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 10px 60px rgba(0,0,0,.7)}
.pmh{background:linear-gradient(135deg,var(--gold),#D4A830);padding:18px;text-align:center}
.pmht{font-family:'Oswald';font-size:36px;font-weight:700;color:var(--bg-dark);text-transform:uppercase;letter-spacing:4px}
.pm-cards{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pm-card{padding:36px;text-align:center;border-right:1px solid var(--border)}
.pm-card:last-child{border-right:none}
.pm-logo{width:50px;height:50px;margin:0 auto 8px}
.pm-logo img{width:50px;height:50px;object-fit:contain}
.pmnr{font-family:'Oswald';font-size:100px;font-weight:700;color:var(--gold);line-height:1}
.pmn{font-family:'Oswald';font-size:42px;font-weight:700;color:var(--white);margin:10px 0 4px;text-transform:uppercase}
.pmt{font-family:'Barlow';font-size:24px;color:var(--text-secondary);margin-bottom:22px}
.pms{display:flex;justify-content:center;gap:40px}
.pmsi{text-align:center}
.pmsv{font-family:'Oswald';font-size:42px;font-weight:700;color:var(--white)}
.pmsl{font-family:'Barlow';font-size:18px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

.h2h{padding:14px 36px 22px}
.h2hr{display:grid;grid-template-columns:130px 1fr 180px 1fr 130px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.h2hv{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-align:center}
.h2hl{font-family:'Oswald';font-size:26px;font-weight:600;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:1px}
.h2hbar{height:26px;border-radius:5px;overflow:hidden;background:var(--row-even)}
.h2hfh{height:100%;background:linear-gradient(90deg,var(--bg-header),var(--teal-light));border-radius:5px 0 0 5px;float:left}
.h2hfa{height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:0 5px 5px 0;float:right}

.rost-title{padding:10px 36px 0;display:flex;align-items:center;gap:14px}
.rost-title img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.rost-title span{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase}
.rost{padding:4px 36px 8px;overflow:hidden}
.rost table{width:100%;border-collapse:collapse}
.rost th{background:var(--bg-header);color:var(--white);padding:6px 6px;text-align:center;font-family:'Oswald';font-weight:600;font-size:18px;text-transform:uppercase}
.rost th:nth-child(2){text-align:left}
.rost td{padding:4px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);font-family:'Barlow Condensed';font-size:20px;color:var(--text-primary)}
.rost td:nth-child(2){text-align:left;font-weight:600}
.rost tr:nth-child(odd){background:var(--row-odd)}.rost tr:nth-child(even){background:var(--row-even)}
.rost .vp{color:var(--green);font-weight:700}.rost .vn{color:var(--accent);font-weight:700}
.rost .bold{font-weight:700;color:var(--gold);font-size:22px}
.rost .gk-tag{color:var(--gold);font-size:16px;font-weight:700}
.rost .st-dot{color:var(--gold);font-size:16px}

.graph-wrap{padding:14px 36px 22px}
.graph-canvas{position:relative;width:100%;height:520px;background:var(--bg-panel);border-radius:10px;border:1px solid var(--border);overflow:hidden}

.pre{width:1700px;max-height:1040px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 12px 80px rgba(0,0,0,.7)}
.pre-top{background:linear-gradient(90deg,var(--bg-header),var(--bg-header-light));padding:20px 50px;text-align:center}
.pre-comp{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.pre-phase{font-family:'Barlow';font-size:24px;color:rgba(255,255,255,.7);margin-top:4px}
.pre-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:30px 60px;gap:40px}
.pre-team{text-align:center}
.pre-logo{width:100px;height:100px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.pre-logo img{max-width:90px;max-height:90px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.pre-tname{font-family:'Oswald';font-size:42px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:1px}
.pre-vsx{font-family:'Oswald';font-size:80px;font-weight:700;color:var(--accent);text-shadow:0 2px 20px rgba(204,51,51,.3)}
.pre-rosters{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--border)}
.pre-rcol{padding:16px 36px 20px}
.pre-rcol:first-child{border-right:1px solid var(--border)}
.pre-rhead{font-family:'Oswald';font-size:22px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.pre-rlist{columns:2;column-gap:20px}
.pre-pl{padding:4px 0;font-family:'Barlow Condensed';font-size:24px;color:var(--text-primary);break-inside:avoid;display:flex;gap:8px}
.pre-pn{font-family:'Oswald';font-size:23px;font-weight:600;color:var(--text-muted);min-width:34px;text-align:right}
.pre-pgk{color:var(--gold);font-weight:700;font-size:18px;margin-left:3px}
.pre-pst{color:var(--gold);font-size:18px;margin-right:2px}
.pre-foot{display:flex;align-items:center;justify-content:center;gap:40px;padding:16px 50px;background:var(--bg-panel);border-top:1px solid var(--border)}
.pre-fi{display:flex;align-items:center;gap:10px;font-family:'Barlow';font-size:24px;color:var(--text-secondary)}
.pre-fi svg{width:22px;height:22px;fill:var(--text-muted)}
.pre-kick{font-family:'Oswald';font-size:32px;font-weight:700;color:var(--gold);animation:pulse 2s ease-in-out infinite}

.sm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:14px 36px 18px}
.sm-court{position:relative;background:var(--bg-panel);border-radius:10px;border:1px solid var(--border);padding:12px;height:560px}
.sm-court svg{width:100%;height:100%}
.gp2-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:20px 40px 24px}
.gp-box{background:var(--bg-panel);border-radius:12px;border:1px solid var(--border);padding:24px 28px}
.gp-title{font-family:'Oswald';font-size:32px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.gp-goal{position:relative;padding:18px 18px 0;background:
  repeating-linear-gradient(90deg,transparent 0,transparent 26px,rgba(255,255,255,.06) 26px,rgba(255,255,255,.06) 27px),
  repeating-linear-gradient(0deg,transparent 0,transparent 26px,rgba(255,255,255,.06) 26px,rgba(255,255,255,.06) 27px),
  linear-gradient(180deg,#0a1622,#0e1e2a);
  border:8px solid #F2F4F7;border-bottom:none;border-radius:10px 10px 0 0;
  box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 6px 24px rgba(0,0,0,.4)}
.gp-net{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gp-cell{aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;background:rgba(20,40,55,.55);border:1px solid rgba(255,255,255,.07)}
.gp-cell.empty{background:transparent;border:1px dashed rgba(255,255,255,.06)}

.off-body{display:grid;grid-template-columns:2fr 3fr;gap:0;min-height:340px}

.off-team-name{font-family:'Oswald';font-size:28px;font-weight:700;color:var(--text-primary);text-transform:uppercase}
.off-staff{padding:4px 0 4px 44px}
.off-staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding-left:44px}

function sanitize(o){
  if(typeof o==='string')return o.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  if(Array.isArray(o))return o.map(sanitize);
  if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=sanitize(o[k]);return r}
  return o;
}

};
function t(k){return T[LANG]?.[k]||T.en[k]||k}
function tPotm(){return t('potm_'+(M?.gender||'m'))}
function matchDur(){return M?.duration||60}
function pga(s){if(!s)return{g:0,a:0,e:0};const p=s.split('/');const g=parseInt(p[0])||0,a=parseInt(p[1])||0;return{g,a,e:a>0?Math.round(g/a*100):0}}
function topS(pl,n=3){return pl.map(p=>({...p,...pga(p.ga)})).filter(p=>p.g>0).sort((a,b)=>b.g-a.g||b.e-a.e).slice(0,n)}
function bestPTeam(team){
  const all=[];
  team.players.forEach(p=>{
    const rating=parseFloat(p.val);
    if(isNaN(rating))return;
    const ga=pga(p.ga);
    all.push({num:p.num,name:p.name,rating,tiebreak:ga.g,isGK:false,ga:p.ga,g:ga.g,a:ga.a,e:ga.e});
  });
  team.gk.forEach(p=>{
    const rating=parseFloat(p.gval);
    if(isNaN(rating))return;
    const sv=pga(p.sav);
    all.push({num:p.num,name:p.name,rating,tiebreak:sv.g,isGK:true,sav:p.sav,svG:sv.g,svA:sv.a,svE:sv.a>0?Math.round(sv.g/sv.a*100):0});
  });
  all.sort((a,b)=>b.rating-a.rating||(b.tiebreak-a.tiebreak));
  return all[0]||null;
}
function pmCard(p,logo,teamName){
  if(!p)return`<div class="pm-card"><div style="color:var(--text-muted);font-size:28px;padding:60px">N/A</div></div>`;
  let stats='';
  if(p.isGK){
    stats=`<div class="pmsi"><div class="pmsv">${p.svE}%</div><div class="pmsl">${t('savePct')}</div></div><div class="pmsi"><div class="pmsv">${p.svG}/${p.svA}</div><div class="pmsl">${t('sv')}</div></div>`;
  }else if(p.g>0){
    stats=`<div class="pmsi"><div class="pmsv">${p.g}/${p.a}</div><div class="pmsl">${t('gl')}</div></div><div class="pmsi"><div class="pmsv">${p.e}%</div><div class="pmsl">${t('eff')}</div></div>`;
  }
  return`<div class="pm-card"><div class="pm-logo"><img src="${logo}" style="width:50px;height:50px;object-fit:contain" onerror="this.style.display='none'"></div><div class="pmnr">#${p.num}</div><div class="pmn">${p.name}</div><div class="pmt">${teamName}${p.isGK?' · GK':''}</div><div class="pms">${stats}<div class="pmsi"><div class="pmsv" style="color:var(--green)">${p.rating}</div><div class="pmsl">${t('rt')}</div></div></div></div>`;
}
function szn(pl){const z={s7m:'s7m',s9m:'s9m',s6m:'s6m',wng:'wing',fb:'fb',brk:'brk'};const r={};for(const[k,lk]of Object.entries(z)){let g=0,a=0;pl.forEach(p=>{if(p[k]){const x=pga(p[k]);g+=x.g;a+=x.a}});r[lk]={g,a,e:a>0?Math.round(g/a*100):0}}return r}

function apC(c){const s=document.documentElement.style;for(const[k,v]of Object.entries(c)){if(typeof v==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(v)&&/^[a-z0-9\-]+$/.test(k))s.setProperty('--'+k,v)}}
function apO(){
  const panels=$.querySelectorAll('.sp,.pm,.pre');
  panels.forEach(el=>{
    if(OPA<1)el.style.setProperty('opacity',OPA,'important');
    else el.style.removeProperty('opacity');
  });
}
function animNums(el,dur,delay){
  const final=el.textContent;
  const parts=final.split(/(-?\d+)/);
  if(!parts.some(p=>/^-?\d+$/.test(p)))return;
  const nums=parts.map(p=>/^-?\d+$/.test(p)?parseInt(p,10):null);
  const t0=performance.now()+(delay||0);
  function fr(now){
    let p=(now-t0)/dur;
    if(p<0){requestAnimationFrame(fr);return}
    if(p>=1){el.textContent=final;return}
    const e=1-Math.pow(1-p,3);
    el.textContent=parts.map((s,i)=>nums[i]!==null?Math.round(nums[i]*e):s).join('');
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
}
function runCounters(sel,delay){
  setTimeout(()=>{
    document.querySelectorAll(sel).forEach((el,i)=>{
      if(el.children.length)return;
      animNums(el,650,i*40);
    });
  },delay||0);
}

function animateGraph(delay){
  delay=delay||800;
  setTimeout(()=>{
    document.querySelectorAll('.draw-line').forEach(path=>{
      const len=path.getTotalLength();
      path.style.strokeDasharray=len;
      path.style.strokeDashoffset=len;
      path.style.setProperty('--len',len);
      path.classList.add('adraw');
    });
    const dots=document.querySelectorAll('.draw-dot');
    dots.forEach((dot,i)=>{
      dot.style.opacity='0';
      setTimeout(()=>{dot.style.opacity='1';dot.style.transition='opacity .2s'},4000+i*20);
    });
    if(dots.length){
      const last=dots[dots.length-1];
      setTimeout(()=>{last.classList.add('dot-pulse')},4200+dots.length*20);
    }
  },delay);
}

function show(type,dur){
  if(!M)return;
  if(cT){clearTimeout(cT);cT=null}
  const existing=$.firstChild;
  const morph=!!existing&&PANEL.includes(CUR)&&PANEL.includes(type);
  if(existing&&morph){
    existing.classList.remove('ac','au','ami');
    existing.classList.add('amo');
    setTimeout(()=>{$.innerHTML='';doShow(type,dur,true)},240);
  }else if(existing){
    existing.classList.remove('ac','au','ami','amo');
    existing.classList.add('ao');
    setTimeout(()=>{$.innerHTML='';doShow(type,dur)},520);
  }else{doShow(type,dur)}
}
function doShow(type,dur,morph){
  const fn={prematch:rPre,prematchclean:rPreClean,h2h:rH2H,goalflash:rGF,topscorers:rTS,gkduel:rGKD,shooting:rSH,shotout:rShotOut,potm:rPM,roster1:()=>rRoster('home'),roster2:()=>rRoster('away'),graph:rGraph,leadgraph:rLeadGraph,momentum:rMomentum,shotmap:rShotMap,shotmaphome:()=>rShotMap1('home'),shotmapaway:()=>rShotMap1('away'),officials:rOfficials};
  if(fn[type])fn[type]();

    root.querySelectorAll('.sph,.pmh,.pre-top').forEach(e=>e.classList.add('sweep'));
    if(type==='goalflash')root.classList.add('sweep');
  }
  const innerDelay=morph?350:700;
  if(['h2h','shooting','shotout','gkduel','topscorers','roster1','roster2','prematch','prematchclean','shotmap','shotmaphome','shotmapaway','officials','momentum'].includes(type))animateInner(innerDelay);
  if(type==='graph'||type==='leadgraph')animateGraph(morph?450:800);
  if(type==='potm')runCounters('.pmsv',900);
  if(type!=='goalflash')runCounters('.ts',morph?250:550);
  if(type!=='goalflash')apO();
  if(dur&&dur>0){cT=setTimeout(()=>{clr()},dur)}
}

function rShotOut(){
  const items=o=>[['gl',o.goal,'#27AE60'],['outSave',o.save,'#378ADD'],['outMiss',o.miss,'#CC3333'],['outPost',o.post,'#F0C040'],['outBlk',o.block,'#9B59B6']];
  const card=(team)=>{
    const o=team.outcomes||{goal:0,save:0,miss:0,post:0,block:0,total:0};
    const it=items(o);
    const stack=o.total?it.map(([k,v,c])=>v>0?`<div style="width:${(v/o.total*100).toFixed(1)}%;background:${c}"></div>`:'').join(''):'';
    const rows=it.map(([k,v,c])=>{
      const p=o.total?Math.round(v/o.total*100):0;
      return`<div class="zr out"><div class="zn"><span class="out-dot" style="background:${c}"></span>${t(k)}</div><div class="zb"><div class="zf" style="width:${p}%;background:${c}"></div></div><div class="zv">${v} · ${p}%</div></div>`;
    }).join('');
    return`<div class="sht"><div class="shtn">${lg(team.logo,28)}${team.shortName}</div><div class="out-total">${o.total} ${t('totShots')}</div><div class="out-stack">${stack}</div>${rows}</div>`;
  };
  $.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('shotout')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="shg">${card(M.home)}${card(M.away)}</div>${srcHtml()}</div>`;
}

// ═══ Side-aware half-court (ps/ss event data) ═══
function courtSVG2(z,tot,teamName,color){
  const W=780,H=540;
  function heat(e){const hue=Math.round(e/100*130);return`hsl(${hue},62%,50%)`}
  function zb(x,y,w,h,label,d){
    if(!d||d.t===0){
      return`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle" font-family="Barlow Condensed" font-size="17" font-weight="600" fill="rgba(255,255,255,.22)">${label}</text>`;
    }
    const e=Math.round(d.g/d.t*100);
    const clr=heat(e);
    return`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${clr}" fill-opacity="0.2" stroke="${clr}" stroke-width="1.5"/>
      <text x="${x+w/2}" y="${y+h/2-9}" text-anchor="middle" font-family="Oswald" font-size="29" font-weight="700" fill="${clr}" style="filter:brightness(1.35)">${d.g}/${d.t}</text>
      <text x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" font-family="Barlow Condensed" font-size="17" font-weight="600" fill="var(--text-secondary)">${label}</text>
      <text x="${x+w/2}" y="${y+h/2+30}" text-anchor="middle" font-family="Barlow" font-size="15" fill="var(--text-muted)">${e}%</text>`;
  }
  let svg=`<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<rect x="10" y="10" width="${W-20}" height="${H-20}" rx="8" fill="var(--bg-panel)" stroke="var(--border)" stroke-width="0.5"/>`;
  // goal
  svg+=`<rect x="${W/2-70}" y="16" width="140" height="10" rx="4" fill="${color}" opacity="0.75"/>`;
  // 6m solid arc
  svg+=`<path d="M${W/2-150} 26 C${W/2-150} 168, ${W/2+150} 168, ${W/2+150} 26" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  // 9m dashed arc
  svg+=`<path d="M${W/2-265} 26 C${W/2-265} 288, ${W/2+265} 288, ${W/2+265} 26" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="7 5"/>`;
  // 7m mark
  svg+=`<line x1="${W/2-8}" y1="150" x2="${W/2+8}" y2="150" stroke="var(--text-muted)" stroke-width="2" opacity="0.5"/>`;
  // wings (goal-line corners)
  svg+=zb(16,36,110,80,t('wingL'),z.wingL);
  svg+=zb(W-126,36,110,80,t('wingR'),z.wingR);
  // 6m line zones
  svg+=zb(160,86,105,76,t('lineL'),z.lineL);
  svg+=zb(W/2-55,66,110,76,t('lineC'),z.lineC);
  svg+=zb(W-265,86,105,76,t('lineR'),z.lineR);
  // 7m penalty
  svg+=zb(W/2-55,158,110,64,t('s7m'),z.p7);
  // 9m backcourt zones
  svg+=zb(92,238,120,82,t('backL'),z.backL);
  svg+=zb(W/2-70,254,140,84,t('backC'),z.backC);
  svg+=zb(W-212,238,120,82,t('backR'),z.backR);
  // bottom band: fast break + breakthrough
  svg+=zb(W/2-172,368,160,72,t('fb'),z.fb);
  svg+=zb(W/2+12,368,160,72,t('brk'),z.brk);
  // footer
  svg+=`<text x="${W/2}" y="478" text-anchor="middle" font-family="Oswald" font-size="27" font-weight="700" fill="var(--text-primary)">${teamName}</text>`;
  svg+=`<text x="${W/2}" y="506" text-anchor="middle" font-family="Barlow Condensed" font-size="23" font-weight="600" fill="var(--text-secondary)">${tot.goals||0}/${tot.shots||0} · ${tot.eff||0}%</text>`;
  svg+=`</svg>`;
  return svg;
}

function gpNet(cells,invert){
  function heat(pct){
    const h=Math.round((pct/100)*130);
    return `hsl(${h},62%,42%)`;
  }
  let html='<div class="gp-net">';
  for(let i=0;i<9;i++){
    if(i===4){html+='<div class="gp-cell empty"></div>';continue}
    const c=cells[i]||{n:0,t:0};
    if(c.t===0){html+='<div class="gp-cell empty"></div>';continue}
    const pct=Math.round(c.n/c.t*100);
    const bg=heat(pct);
    html+=`<div class="gp-cell" style="background:${bg};border-color:rgba(255,255,255,.18)"><div class="gpv" style="color:#fff">${c.n}/${c.t}</div><div class="gpp" style="color:rgba(255,255,255,.9)">${pct}%</div></div>`;
  }
  html+='</div>';
  return `<div class="gp-goal">${html}</div><div class="gp-ground"></div>`;
}

function rGraph(){const ev=M.goalEvents||[];if(!ev.length){$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('graph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div style="padding:60px;text-align:center;color:var(--text-muted);font-size:32px">No goal data</div>${srcHtml()}</div>`;return}
const pts=[{sk:0,r1:0,r2:0}];let _p1=0,_p2=0;ev.forEach(e=>{if(e.r1>_p1){pts.push({sk:e.sk,r1:e.r1,r2:e.r2,team:1});_p1=e.r1;_p2=e.r2}else if(e.r2>_p2){pts.push({sk:e.sk,r1:e.r1,r2:e.r2,team:2});_p2=e.r2;_p1=e.r1}});
const DUR=matchDur(),DURS=DUR*60,HALF=DUR/2;
const maxG=Math.max(M.home.score,M.away.score,1);const lastSk=Math.max(pts[pts.length-1].sk,DURS);
const W=1600,H=490,pL=70,pR=40,pT=40,pB=60,cW=W-pL-pR,cH=H-pT-pB;
function xp(sk){return pL+(sk/lastSk)*cW}function yp(g){return pT+cH-(g/maxG)*cH}
const hC='#4E8098',aC2='#CC3333';
const hWin=M.home.score>M.away.score,aWin=M.away.score>M.home.score;
let svg=`<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:'Barlow Condensed',sans-serif">`;
for(let i=0;i<=maxG;i++){const yy=yp(i);svg+=`<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="rgba(255,255,255,.06)"/><text x="${pL-14}" y="${yy+7}" fill="#6A8090" font-size="22" text-anchor="end" font-weight="600">${i}</text>`}
const maxMin=Math.ceil(lastSk/60);
for(let m=0;m<=maxMin;m+=5){const sk2=m*60;if(sk2>lastSk)continue;const xx=xp(sk2);svg+=`<line x1="${xx}" y1="${pT}" x2="${xx}" y2="${H-pB}" stroke="rgba(255,255,255,.04)"/><text x="${xx}" y="${H-pB+28}" fill="#6A8090" font-size="22" text-anchor="middle" font-weight="600">${m}'</text>`}
const htX=xp(HALF*60);svg+=`<line x1="${htX}" y1="${pT}" x2="${htX}" y2="${H-pB}" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="8,4"/><text x="${htX}" y="${pT-12}" fill="rgba(255,255,255,.5)" font-size="22" text-anchor="middle" font-weight="700">HT</text>`;
if(lastSk>DURS){const otX=xp(DURS);svg+=`<line x1="${otX}" y1="${pT}" x2="${otX}" y2="${H-pB}" stroke="rgba(240,192,64,.4)" stroke-width="2" stroke-dasharray="8,4"/><text x="${otX}" y="${pT-12}" fill="rgba(240,192,64,.7)" font-size="22" text-anchor="middle" font-weight="700">${LANG==='ro'?'PREL':'OT'}</text>`}
function stepPath(teamNum,scoreFn){let path=`M${xp(0).toFixed(1)},${yp(0).toFixed(1)}`;let cur=0,endSk=0;for(let i=1;i<pts.length;i++){const p=pts[i];if(p.team===teamNum){path+=` L${xp(p.sk).toFixed(1)},${yp(cur).toFixed(1)}`;cur=scoreFn(p);path+=` L${xp(p.sk).toFixed(1)},${yp(cur).toFixed(1)}`}endSk=p.sk}if(endSk>0)path+=` L${xp(endSk).toFixed(1)},${yp(cur).toFixed(1)}`;return path} const pH=stepPath(1,p=>p.r1);const pA2=stepPath(2,p=>p.r2);
svg+=`<path class="draw-line" d="${pH}" fill="none" stroke="${hC}" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round" style="${hWin?'filter:drop-shadow(0 0 5px rgba(78,128,152,.75))':''}"/><path class="draw-line" d="${pA2}" fill="none" stroke="${aC2}" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round" style="${aWin?'filter:drop-shadow(0 0 5px rgba(204,51,51,.75))':''}"/>`;
pts.forEach((p,i)=>{if(i===0)return;if(p.team===1)svg+=`<circle class="draw-dot" cx="${xp(p.sk).toFixed(1)}" cy="${yp(p.r1).toFixed(1)}" r="6" fill="${hC}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;else svg+=`<circle class="draw-dot" cx="${xp(p.sk).toFixed(1)}" cy="${yp(p.r2).toFixed(1)}" r="6" fill="${aC2}" stroke="#fff" stroke-width="2.5" opacity="0"/>`});
svg+=`<rect x="${pL+14}" y="${pT+8}" width="20" height="5" rx="2" fill="${hC}"/><text x="${pL+40}" y="${pT+16}" fill="#F0F4F7" font-size="22" font-weight="700">${M.home.shortName}</text>`;
const lw=M.home.shortName.length*12+60;svg+=`<rect x="${pL+lw}" y="${pT+8}" width="20" height="5" rx="2" fill="${aC2}"/><text x="${pL+lw+26}" y="${pT+16}" fill="#F0F4F7" font-size="22" font-weight="700">${M.away.shortName}</text>`;
svg+=`</svg>`;
$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('graph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="graph-wrap"><div class="graph-canvas">${svg}</div></div>${srcHtml()}</div>`}

// ═══ NEW: Lead graph — score difference over time (±) ═══
function rLeadGraph(){
  const ev=M.goalEvents||[];
  if(!ev.length){$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('leadgraph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div style="padding:60px;text-align:center;color:var(--text-muted);font-size:32px">No goal data</div>${srcHtml()}</div>`;return}
  const pts=[{sk:0,d:0}];
  ev.forEach(e=>pts.push({sk:e.sk,d:e.r1-e.r2,team:e.team}));
  const DUR=matchDur(),DURS=DUR*60,HALF=DUR/2;
  const maxAbs=Math.max(2,...pts.map(p=>Math.abs(p.d)));
  const lastSk=Math.max(pts[pts.length-1].sk,DURS);
  const W=1600,H=490,pL=90,pR=40,pT=40,pB=60,cW=W-pL-pR,cH=H-pT-pB;
  const midY=pT+cH/2;
  function xp(sk){return pL+(sk/lastSk)*cW}
  function yp(d){return midY-(d/maxAbs)*(cH/2)}
  const hC='#4E8098',aC2='#CC3333';
  let svg=`<svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:'Barlow Condensed',sans-serif">`;
  // tinted halves: top = home leading, bottom = away leading
  svg+=`<rect x="${pL}" y="${pT}" width="${cW}" height="${cH/2}" fill="${hC}" fill-opacity="0.05"/>`;
  svg+=`<rect x="${pL}" y="${midY}" width="${cW}" height="${cH/2}" fill="${aC2}" fill-opacity="0.05"/>`;
  // horizontal gridlines at each diff level with labels
  const step=maxAbs<=6?1:Math.ceil(maxAbs/6);
  for(let d=-maxAbs;d<=maxAbs;d+=step){
    const yy=yp(d);
    svg+=`<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="rgba(255,255,255,${d===0?'.25':'.06'})"${d===0?' stroke-width="2"':''}/>`;
    if(d!==0)svg+=`<text x="${pL-14}" y="${yy+7}" fill="${d>0?hC:aC2}" font-size="22" text-anchor="end" font-weight="700">+${Math.abs(d)}</text>`;
  }
  svg+=`<text x="${pL-14}" y="${midY+7}" fill="#6A8090" font-size="20" text-anchor="end" font-weight="600">0</text>`;
  // minute ticks
  const maxMin=Math.ceil(lastSk/60);
  for(let m=0;m<=maxMin;m+=5){const sk2=m*60;if(sk2>lastSk)continue;const xx=xp(sk2);svg+=`<line x1="${xx}" y1="${pT}" x2="${xx}" y2="${H-pB}" stroke="rgba(255,255,255,.04)"/><text x="${xx}" y="${H-pB+28}" fill="#6A8090" font-size="22" text-anchor="middle" font-weight="600">${m}'</text>`}
  // HT line
  const htX=xp(HALF*60);svg+=`<line x1="${htX}" y1="${pT}" x2="${htX}" y2="${H-pB}" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="8,4"/><text x="${htX}" y="${pT-12}" fill="rgba(255,255,255,.5)" font-size="22" text-anchor="middle" font-weight="700">HT</text>`;
  if(lastSk>DURS){const otX=xp(DURS);svg+=`<line x1="${otX}" y1="${pT}" x2="${otX}" y2="${H-pB}" stroke="rgba(240,192,64,.4)" stroke-width="2" stroke-dasharray="8,4"/><text x="${otX}" y="${pT-12}" fill="rgba(240,192,64,.7)" font-size="22" text-anchor="middle" font-weight="700">${LANG==='ro'?'PREL':'OT'}</text>`}
  // step path of the difference
  let path=`M${xp(0).toFixed(1)},${yp(0).toFixed(1)}`;
  let prevD=0;
  for(let i=1;i<pts.length;i++){
    const p=pts[i];
    path+=` L${xp(p.sk).toFixed(1)},${yp(prevD).toFixed(1)} L${xp(p.sk).toFixed(1)},${yp(p.d).toFixed(1)}`;
    prevD=p.d;
  }
  path+=` L${xp(lastSk).toFixed(1)},${yp(prevD).toFixed(1)}`;
  svg+=`<path class="draw-line" d="${path}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(240,192,64,.5))"/>`;
  // dots colored by scoring team
  for(let i=1;i<pts.length;i++){
    const p=pts[i];
    svg+=`<circle class="draw-dot" cx="${xp(p.sk).toFixed(1)}" cy="${yp(p.d).toFixed(1)}" r="6" fill="${p.team===1?hC:aC2}" stroke="#fff" stroke-width="2.5" opacity="0"/>`;
  }
  // team zone labels
  svg+=`<text x="${pL+14}" y="${pT+26}" fill="${hC}" font-size="24" font-weight="700">▲ ${M.home.shortName}</text>`;
  svg+=`<text x="${pL+14}" y="${H-pB-12}" fill="${aC2}" font-size="24" font-weight="700">▼ ${M.away.shortName}</text>`;
  svg+=`</svg>`;
  $.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('leadgraph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="graph-wrap"><div class="graph-canvas">${svg}</div></div>${srcHtml()}</div>`;
}

function srcHtml(){return`<div class="src">${t('source')}: frhlive.com</div>`}

function rOfficials(){
  const o=M.officials||{};
  $.innerHTML=`<div class="sp ac" style="position:relative"><div class="sph"><div class="spt">${t('officials')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="off-body"><div class="off-left">
    ${o.ref1?`<div class="off-role">${t('referee')} 1</div><div class="off-name"><span class="off-dot"></span>${o.ref1}</div>`:''}
    ${o.ref2?`<div class="off-role">${t('referee')} 2</div><div class="off-name"><span class="off-dot"></span>${o.ref2}</div>`:''}
    ${o.observer?`<div class="off-role">${t('observer')}</div><div class="off-name"><span class="off-dot"></span>${o.observer}</div>`:''}
    ${o.delegat?`<div class="off-role">${t('delegate')}</div><div class="off-name"><span class="off-dot"></span>${o.delegat}</div>`:''}
  </div><div class="off-right">
    <div class="off-team"><div class="off-team-hdr">${lg(M.home.logo,32)}<div class="off-team-name">${M.home.shortName}</div></div>
      <div class="off-staff-grid">
      ${o.homeCoach?`<div class="off-staff"><div class="off-staff-role">${t('headCoach')}</div><div class="off-staff-name">${o.homeCoach}</div></div>`:''}
      ${o.homeC?`<div class="off-staff"><div class="off-staff-role">${t('official')}</div><div class="off-staff-name">${o.homeC}</div></div>`:''}
      ${o.homeAsst?`<div class="off-staff"><div class="off-staff-role">${t('asstCoach')}</div><div class="off-staff-name">${o.homeAsst}</div></div>`:''}
      ${o.homeD?`<div class="off-staff"><div class="off-staff-role">${t('official')}</div><div class="off-staff-name">${o.homeD}</div></div>`:''}</div></div>
    <div class="off-team"><div class="off-team-hdr">${lg(M.away.logo,32)}<div class="off-team-name">${M.away.shortName}</div></div>
      <div class="off-staff-grid">
      ${o.awayCoach?`<div class="off-staff"><div class="off-staff-role">${t('headCoach')}</div><div class="off-staff-name">${o.awayCoach}</div></div>`:''}
      ${o.awayC?`<div class="off-staff"><div class="off-staff-role">${t('official')}</div><div class="off-staff-name">${o.awayC}</div></div>`:''}
      ${o.awayAsst?`<div class="off-staff"><div class="off-staff-role">${t('asstCoach')}</div><div class="off-staff-name">${o.awayAsst}</div></div>`:''}
      ${o.awayD?`<div class="off-staff"><div class="off-staff-role">${t('official')}</div><div class="off-staff-name">${o.awayD}</div></div>`:''}</div></div>
  </div></div><div class="off-foot">${M.competition||''} ${M.phase?'· '+M.phase:''} ${M.venue?'· '+M.venue:''}${M.city?', '+M.city:''}</div>${srcHtml()}</div>`;
}

// ═══ FIREBASE ═══
if(ref){
  ref.child('command').on('value',s=>{const v=s.val();if(!v)return;if(v.type==='show')show(v.overlay,v.duration||0);if(v.type==='clear')clr()});
  ref.child('match').on('value',s=>{const v=s.val();if(v)M=sanitize(v)});
  ref.child('lang').on('value',s=>{const v=s.val();if(v==='en'||v==='ro')LANG=v});
  ref.child('colors').on('value',s=>{const v=s.val();if(v&&typeof v==='object')apC(v)});
  ref.child('opacity').on('value',s=>{const v=s.val();OPA=v!=null?Math.min(Math.max(v,20),100)/100:1;apO()});
}
