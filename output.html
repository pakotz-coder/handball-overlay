<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Handball Overlay Output</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-dark:#1A2D3D;--bg-panel:#1E3448;--bg-header:#2B5876;--bg-header-light:#4E8098;--accent:#CC3333;--accent-bright:#E74C3C;--accent-dark:#A02020;--teal:#3A5A6A;--teal-light:#4A7A8A;--green:#27AE60;--gold:#F0C040;--white:#FFFFFF;--text-primary:#F0F4F7;--text-secondary:#9AABB8;--text-muted:#6A8090;--border:#2A4A5A;--row-even:#1A3040;--row-odd:#1E3A4C;--score-bg:#0E1E2A}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}
.ov{position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes si{from{transform:translate(-50%,-50%) scale(.92);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}
.au{animation:su .45s cubic-bezier(.22,1,.36,1) forwards}
.af{animation:fi .5s ease forwards}
.ac{animation:si .45s cubic-bezier(.22,1,.36,1) forwards}
.ao{animation:fo .35s ease forwards}
.scorebug{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;height:72px;border-radius:6px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.55)}
.sbt{display:flex;align-items:center;gap:12px;padding:0 22px;min-width:290px;background:linear-gradient(135deg,var(--bg-header),var(--bg-header-light))}
.sbt.aw{background:linear-gradient(135deg,var(--bg-header-light),var(--bg-header))}
.sbl{width:42px;height:42px;border-radius:4px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sbl img{width:38px;height:38px;object-fit:contain}
.sbn{font-family:'Oswald';font-size:21px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.4px}
.sbs{display:flex;align-items:center;background:var(--score-bg);padding:0 6px}
.sbv{font-family:'Oswald';font-size:46px;font-weight:700;color:var(--white);width:56px;text-align:center;line-height:1}
.sbsp{font-family:'Oswald';font-size:34px;color:var(--text-muted);margin:0 2px}
.sbtm{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;background:var(--accent);min-width:76px}
.sbtv{font-family:'Oswald';font-size:23px;font-weight:700;color:var(--white)}
.sbtl{font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px}
.sp{position:absolute;top:50%;left:50%;width:1100px;background:var(--bg-dark);border-radius:8px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.sph{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--accent),var(--accent-dark));padding:13px 28px}
.spt{font-family:'Oswald';font-size:19px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:2px}
.spu{font-size:13px;color:rgba(255,255,255,.75)}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 28px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
.tn{font-family:'Oswald';font-size:21px;font-weight:600;color:var(--text-primary);text-transform:uppercase}
.tn.r{text-align:right}
.ts{font-family:'Oswald';font-size:34px;font-weight:700;color:var(--white);text-align:center;background:var(--score-bg);border-radius:6px;padding:4px 22px}
.scs{padding:0 28px 16px}
.scl{font-family:'Oswald';font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;padding:10px 0 5px}
.scr{display:grid;grid-template-columns:34px 1fr 68px 54px;align-items:center;padding:7px 10px;border-radius:3px;margin-bottom:2px}
.scr:nth-child(odd){background:var(--row-odd)}.scr:nth-child(even){background:var(--row-even)}
.scn{font-size:13px;font-weight:700;color:var(--text-muted);text-align:center}
.scnm{font-size:14.5px;color:var(--text-primary)}
.scg{font-family:'Oswald';font-size:19px;font-weight:700;color:var(--gold);text-align:center}
.sce{font-size:12.5px;color:var(--text-secondary);text-align:center}
.gks{padding:16px 28px}
.gkl{font-family:'Oswald';font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.gkc{display:flex;gap:16px;margin-bottom:14px;padding:10px;background:var(--bg-panel);border-radius:6px;border:1px solid var(--border)}
.gkb{text-align:center;min-width:80px}
.gkp{font-family:'Oswald';font-size:32px;font-weight:700;color:var(--green)}
.gkpl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.gkd{flex:1}
.gkn{font-family:'Oswald';font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.gbr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.gbl{font-size:12px;color:var(--text-secondary);width:44px;text-align:right}
.gbt{flex:1;height:18px;background:var(--row-even);border-radius:3px;overflow:hidden}
.gbf{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:10px;font-weight:700;color:var(--white);transition:width .7s ease}
.gbf.h{background:linear-gradient(90deg,var(--bg-header),var(--teal-light))}
.gbf.a{background:linear-gradient(90deg,var(--accent-dark),var(--accent))}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 28px}
.sht{background:var(--bg-panel);border-radius:6px;padding:12px;border:1px solid var(--border)}
.shtn{font-family:'Oswald';font-size:14px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.zr{display:grid;grid-template-columns:70px 1fr 80px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.zn{font-size:12.5px;color:var(--text-secondary)}
.zb{height:15px;background:var(--row-even);border-radius:2px;overflow:hidden}
.zf{height:100%;border-radius:2px;min-width:2px;transition:width .6s ease}
.zf.h{background:var(--bg-header-light)}.zf.a{background:var(--accent)}
.zv{font-size:12.5px;font-weight:700;color:var(--text-primary);text-align:right}
.pm{position:absolute;top:50%;left:50%;width:580px;background:var(--bg-dark);border-radius:8px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.6);text-align:center}
.pmh{background:linear-gradient(135deg,var(--gold),#D4A830);padding:13px}
.pmht{font-family:'Oswald';font-size:17px;font-weight:700;color:var(--bg-dark);text-transform:uppercase;letter-spacing:3px}
.pmb{padding:24px}
.pmnr{font-family:'Oswald';font-size:66px;font-weight:700;color:var(--gold);line-height:1}
.pmn{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--white);margin:6px 0 3px;text-transform:uppercase}
.pmt{font-size:14px;color:var(--text-secondary);margin-bottom:14px}
.pms{display:flex;justify-content:center;gap:24px}
.pmsi{text-align:center}
.pmsv{font-family:'Oswald';font-size:26px;font-weight:700;color:var(--white)}
.pmsl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.gf{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;height:62px;border-radius:6px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.gft{background:var(--accent);display:flex;align-items:center;padding:0 18px;font-family:'Oswald';font-size:21px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:2px}
.gfp{background:var(--bg-dark);display:flex;align-items:center;gap:10px;padding:0 20px}
.gfn{font-family:'Oswald';font-size:26px;font-weight:700;color:var(--gold)}
.gfnm{font-size:17px;color:var(--text-primary)}
.gfd{font-size:12px;color:var(--text-secondary)}
.gfsc{background:var(--score-bg);display:flex;align-items:center;padding:0 18px;font-family:'Oswald';font-size:28px;font-weight:700;color:var(--white)}
#cs{position:fixed;top:4px;right:4px;font-size:10px;padding:3px 8px;border-radius:3px;z-index:9999}
#cs.ok{background:rgba(39,174,96,.2);color:#27AE60}
#cs.w{background:rgba(255,167,38,.2);color:#ffa726}
</style>
</head>
<body>
<div id="cs" class="w">Connecting...</div>
<div class="ov" id="ov"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FC={apiKey:"AIzaSyD2l1tmw1hVpv9dxrA-4DiYVjR0uPoADPM",authDomain:"handball-overlay.firebaseapp.com",databaseURL:"https://handball-overlay-default-rtdb.europe-west1.firebasedatabase.app",projectId:"handball-overlay",storageBucket:"handball-overlay.firebasestorage.app",messagingSenderId:"926258764",appId:"1:926258764:web:4435158617393fa0a5c6e9"};
const P=new URLSearchParams(location.search),ROOM=P.get('room')||'default';
let db,ref,M=null,LANG='en',cT=null;
try{firebase.initializeApp(FC);db=firebase.database();ref=db.ref('rooms/'+ROOM);document.getElementById('cs').textContent='Connected ✓';document.getElementById('cs').className='ok';setTimeout(()=>{document.getElementById('cs').style.display='none'},3000)}catch(e){document.getElementById('cs').textContent=e.message}

const T={
  en:{goal:'Goal',topScorers:'Top Scorers',gkDuel:'Goalkeeper Duel',shooting:'Shooting Breakdown',potm:'Player of the Match',ht:'Halftime',ft:'Full Time',live:'Live',end:'End',sr:'Save Rate',sv:'saves',sh:'shots',eff:'Efficiency',gl:'Goals',rt:'Rating',s7m:'7m Penalty',s9m:'9m Backcourt',s6m:'6m Line',wing:'Wing',fb:'Fast Break',brk:'Breakthrough'},
  ro:{goal:'Gol',topScorers:'Golgheteri',gkDuel:'Duelul Portarilor',shooting:'Aruncări pe Zone',potm:'Jucătoarea Meciului',ht:'Pauză',ft:'Final',live:'Live',end:'Final',sr:'Proc. Parade',sv:'parade',sh:'aruncări',eff:'Eficiență',gl:'Goluri',rt:'Rating',s7m:'7m Penalti',s9m:'9m Semicercul',s6m:'6m Linia',wing:'Extremă',fb:'Contraatac',brk:'Pătrundere'}
};
function t(k){return T[LANG]?.[k]||T.en[k]||k}
function pga(s){if(!s)return{g:0,a:0,e:0};const p=s.split('/');const g=parseInt(p[0])||0,a=parseInt(p[1])||0;return{g,a,e:a>0?Math.round(g/a*100):0}}
function topS(pl,n=3){return pl.map(p=>({...p,...pga(p.ga)})).filter(p=>p.g>0).sort((a,b)=>b.g-a.g||b.e-a.e).slice(0,n)}
function bestP(){const all=[...M.home.players.map(p=>({...p,team:M.home.shortName})),...M.away.players.map(p=>({...p,team:M.away.shortName}))];return all.filter(p=>p.val&&p.val!=='').sort((a,b)=>parseFloat(b.val)-parseFloat(a.val))[0]}
function szn(pl){const z={s7m:'s7m',s9m:'s9m',s6m:'s6m',wng:'wing',fb:'fb',brk:'brk'};const r={};for(const[k,lk]of Object.entries(z)){let g=0,a=0;pl.forEach(p=>{if(p[k]){const x=pga(p[k]);g+=x.g;a+=x.a}});r[lk]={g,a,e:a>0?Math.round(g/a*100):0}}return r}

const $=document.getElementById('ov');
function clr(){if(cT)clearTimeout(cT);$.innerHTML=''}
function apC(c){const s=document.documentElement.style;for(const[k,v]of Object.entries(c))s.setProperty('--'+k,v)}
function stL(){if(!M)return'';if(M.status==='End')return t('ft');if(M.time==='30:00')return t('ht');return M.time||t('live')}

function show(type,dur){
  if(!M)return;clr();
  const fn={scorebug:rSB,goalflash:rGF,topscorers:rTS,gkduel:rGK,shooting:rSH,potm:rPM};
  if(fn[type])fn[type]();
  if(dur&&dur>0){cT=setTimeout(()=>{$.firstChild?.classList.add('ao');setTimeout(clr,400)},dur)}
}

function rSB(){const h=M.home,a=M.away;$.innerHTML=`<div class="scorebug au"><div class="sbt"><div class="sbl">${h.logo?`<img src="${h.logo}">`:`<span style="font-size:18px;color:#fff;font-weight:700">${h.shortName[0]}</span>`}</div><div class="sbn">${h.shortName}</div></div><div class="sbs"><div class="sbv">${h.score}</div><div class="sbsp">:</div><div class="sbv">${a.score}</div></div><div class="sbt aw"><div class="sbn">${a.shortName}</div><div class="sbl">${a.logo?`<img src="${a.logo}">`:`<span style="font-size:18px;color:#fff;font-weight:700">${a.shortName[0]}</span>`}</div></div><div class="sbtm"><div class="sbtv">${M.time||''}</div><div class="sbtl">${M.status==='End'?t('end'):t('live')}</div></div></div>`}

function rGF(){const s=M.home.players.find(p=>pga(p.ga).g>0)||M.away.players.find(p=>pga(p.ga).g>0);if(!s)return;const{g,a,e}=pga(s.ga);$.innerHTML=`<div class="gf au"><div class="gft">${t('goal')}</div><div class="gfp"><div class="gfn">#${s.num}</div><div><div class="gfnm">${s.name}</div><div class="gfd">${g}/${a} (${e}%)</div></div></div><div class="gfsc">${M.home.score} : ${M.away.score}</div></div>`}

function rTS(){const hT=topS(M.home.players),aT=topS(M.away.players);const rows=arr=>arr.map(p=>`<div class="scr"><div class="scn">${p.num}</div><div class="scnm">${p.name}</div><div class="scg">${p.g}/${p.a}</div><div class="sce">${p.e}%</div></div>`).join('');$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('topScorers')}</div><div class="spu">${stL()}</div></div><div class="tb"><div class="tn">${M.home.shortName}</div><div class="ts">${M.home.score} : ${M.away.score}</div><div class="tn r">${M.away.shortName}</div></div><div class="scs"><div class="scl">${M.home.shortName}</div>${rows(hT)}<div class="scl" style="margin-top:6px">${M.away.shortName}</div>${rows(aT)}</div></div>`}

function rGK(){
  function card(gk,side){
    if(!gk||!gk.sav)return`<div style="padding:14px;color:var(--text-muted)">N/A</div>`;
    const sv=pga(gk.sav);const pct=sv.a>0?Math.round(sv.g/sv.a*100):0;
    const zones=[{k:'gs7m',l:t('s7m')},{k:'gs9m',l:t('s9m')},{k:'gs6m',l:t('s6m')},{k:'gwng',l:t('wing')},{k:'gfb',l:t('fb')}];
    return`<div class="gkc"><div class="gkb"><div class="gkp">${pct}%</div><div class="gkpl">${t('sr')}</div></div><div class="gkd"><div class="gkn">#${gk.num} ${gk.name}</div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:5px">${sv.g} ${t('sv')} / ${sv.a} ${t('sh')}</div>${zones.filter(z=>gk[z.k]).map(z=>{const d=pga(gk[z.k]);const w=d.a>0?Math.round(d.g/d.a*100):0;return`<div class="gbr"><div class="gbl">${z.l}</div><div class="gbt"><div class="gbf ${side}" style="width:${w}%">${d.g}/${d.a}</div></div></div>`}).join('')}</div></div>`
  }
  $.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('gkDuel')}</div><div class="spu">${stL()}</div></div><div class="tb"><div class="tn">${M.home.shortName}</div><div class="ts">${M.home.score} : ${M.away.score}</div><div class="tn r">${M.away.shortName}</div></div><div class="gks"><div class="gkl">${M.home.shortName}</div>${M.home.gk.map(g=>card(g,'h')).join('')}<div class="gkl" style="margin-top:10px">${M.away.shortName}</div>${M.away.gk.length?M.away.gk.map(g=>card(g,'a')).join(''):'<div style="padding:10px;color:var(--text-muted)">N/A</div>'}</div></div>`
}

function rSH(){
  const hZ=szn(M.home.players),aZ=szn(M.away.players);
  const zKeys=['s7m','s9m','s6m','wing','fb','brk'];
  const zR=(zones,side)=>zKeys.map(k=>{const d=zones[k]||{g:0,a:0,e:0};return`<div class="zr"><div class="zn">${t(k)}</div><div class="zb"><div class="zf ${side}" style="width:${d.e}%"></div></div><div class="zv">${d.g}/${d.a} (${d.e}%)</div></div>`}).join('');
  $.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('shooting')}</div><div class="spu">${stL()}</div></div><div class="tb"><div class="tn">${M.home.shortName}</div><div class="ts">${M.home.score} : ${M.away.score}</div><div class="tn r">${M.away.shortName}</div></div><div class="shg"><div class="sht"><div class="shtn">${M.home.shortName}</div>${zR(hZ,'h')}</div><div class="sht"><div class="shtn">${M.away.shortName}</div>${zR(aZ,'a')}</div></div></div>`
}

function rPM(){const b=bestP();if(!b)return;const{g,a,e}=pga(b.ga);$.innerHTML=`<div class="pm ac"><div class="pmh"><div class="pmht">${t('potm')}</div></div><div class="pmb"><div class="pmnr">#${b.num}</div><div class="pmn">${b.name}</div><div class="pmt">${b.team}</div><div class="pms">${g>0?`<div class="pmsi"><div class="pmsv">${g}/${a}</div><div class="pmsl">${t('gl')}</div></div><div class="pmsi"><div class="pmsv">${e}%</div><div class="pmsl">${t('eff')}</div></div>`:''}<div class="pmsi"><div class="pmsv" style="color:var(--green)">${b.val}</div><div class="pmsl">${t('rt')}</div></div></div></div></div>`}

// ═══ FIREBASE LISTENERS ═══
if(ref){
  ref.child('command').on('value',s=>{const v=s.val();if(!v)return;if(v.type==='show')show(v.overlay,v.duration||0);if(v.type==='clear')clr()});
  ref.child('match').on('value',s=>{const v=s.val();if(v)M=v});
  ref.child('lang').on('value',s=>{const v=s.val();if(v)LANG=v});
  ref.child('colors').on('value',s=>{const v=s.val();if(v)apC(v)});
}
</script>
</body>
</html>
