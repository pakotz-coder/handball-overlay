<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Handball Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-dark:#1A2D3D;--bg-panel:#1E3448;--bg-header:#2B5876;--bg-header-light:#4E8098;--accent:#CC3333;--accent-dark:#A02020;--teal:#3A5A6A;--teal-light:#4A7A8A;--green:#27AE60;--gold:#F0C040;--white:#FFF;--text-primary:#F0F4F7;--text-secondary:#9AABB8;--text-muted:#6A8090;--border:#2A4A5A;--row-even:rgba(26,48,64,.95);--row-odd:rgba(30,58,76,.95);--score-bg:#0E1E2A}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}
.ov{position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes si{from{transform:translate(-50%,-50%) scale(.92);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.au{animation:su .45s cubic-bezier(.22,1,.36,1) forwards}
.ac{animation:si .45s cubic-bezier(.22,1,.36,1) forwards}
.ao{animation:fo .35s ease forwards}

/* SHARED PANEL — near full screen */
.sp{position:absolute;top:50%;left:50%;width:1700px;max-height:1020px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 10px 60px rgba(0,0,0,.7)}
/* Header bar */
.sph{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--accent),var(--accent-dark));padding:18px 44px}
.spt{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.spu{font-family:'Barlow';font-size:32px;color:rgba(255,255,255,.85);font-weight:600}
/* Team banner */
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 44px;background:var(--bg-panel);border-bottom:2px solid var(--border)}
.tside{display:flex;align-items:center;gap:14px}
.tside.r{justify-content:flex-end}
.tlogo{width:50px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0}
.tlogo img{width:50px;height:50px;object-fit:contain}
.tn{font-family:'Oswald';font-size:38px;font-weight:700;color:var(--text-primary);text-transform:uppercase}
.ts{font-family:'Oswald';font-size:64px;font-weight:700;color:var(--white);text-align:center;background:var(--score-bg);border-radius:8px;padding:4px 36px;line-height:1.1}

/* ═══ GOAL FLASH ═══ */
.gf{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;height:110px;border-radius:12px;overflow:hidden;box-shadow:0 6px 40px rgba(0,0,0,.6)}
.gft{background:var(--accent);display:flex;align-items:center;padding:0 36px;font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.gfp{background:var(--bg-dark);display:flex;align-items:center;gap:20px;padding:0 40px}
.gfn{font-family:'Oswald';font-size:54px;font-weight:700;color:var(--gold)}
.gfnm{font-family:'Barlow Condensed';font-size:38px;font-weight:600;color:var(--text-primary)}
.gfd{font-family:'Barlow';font-size:26px;color:var(--text-secondary)}
.gfsc{background:var(--score-bg);display:flex;align-items:center;padding:0 36px;font-family:'Oswald';font-size:58px;font-weight:700;color:var(--white)}

/* ═══ TOP SCORERS ═══ */
.scs{padding:10px 44px 20px}
.scl{font-family:'Oswald';font-size:30px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:12px 0 8px;display:flex;align-items:center;gap:10px}
.scl img{width:30px;height:30px;object-fit:contain}
.scr{display:grid;grid-template-columns:60px 1fr 120px 90px;align-items:center;padding:14px 20px;border-radius:6px;margin-bottom:4px}
.scr:nth-child(odd){background:var(--row-odd)}.scr:nth-child(even){background:var(--row-even)}
.scn{font-family:'Oswald';font-size:32px;font-weight:600;color:var(--text-muted);text-align:center}
.scnm{font-family:'Barlow Condensed';font-size:34px;font-weight:600;color:var(--text-primary)}
.scg{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--gold);text-align:center}
.sce{font-family:'Barlow';font-size:28px;color:var(--text-secondary);text-align:center}

/* ═══ GK DUEL ═══ */
.gks{padding:14px 44px 18px}
.gks-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.gks-col-label{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.gks-col-label img{width:28px;height:28px;object-fit:contain}
.gkc2{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--bg-panel);border-radius:8px;border:1px solid var(--border);margin-bottom:8px}
.gkc2-pct{font-family:'Oswald';font-size:48px;font-weight:700;color:var(--green);min-width:90px;text-align:center}
.gkc2-info{flex:1;min-width:0}
.gkc2-name{font-family:'Oswald';font-size:28px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gkc2-det{font-family:'Barlow';font-size:22px;color:var(--text-secondary)}
.gkc2-bars{flex:1;min-width:0}
.gkb2{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.gkb2-l{font-family:'Barlow';font-size:20px;color:var(--text-muted);width:40px;text-align:right;flex-shrink:0}
.gkb2-track{flex:1;height:18px;background:var(--row-even);border-radius:3px;overflow:hidden}
.gkb2-fill{height:100%;border-radius:3px;min-width:1px}.gkb2-fill.h{background:var(--teal-light)}.gkb2-fill.a{background:var(--accent)}
.gkb2-v{font-family:'Barlow';font-size:18px;font-weight:700;color:var(--text-secondary);width:44px;flex-shrink:0}

/* ═══ SHOOTING ═══ */
.shg{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:14px 44px 18px}
.sht{background:var(--bg-panel);border-radius:10px;padding:18px 20px;border:1px solid var(--border)}
.shtn{font-family:'Oswald';font-size:30px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px}
.shtn img{width:28px;height:28px;object-fit:contain}
.zr{display:grid;grid-template-columns:140px 1fr 140px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.zn{font-family:'Barlow Condensed';font-size:28px;font-weight:600;color:var(--text-secondary)}
.zb{height:20px;background:var(--row-even);border-radius:4px;overflow:hidden}
.zf{height:100%;border-radius:4px;min-width:2px}.zf.h{background:var(--bg-header-light)}.zf.a{background:var(--accent)}
.zv{font-family:'Barlow Condensed';font-size:28px;font-weight:700;color:var(--text-primary);text-align:right}

/* ═══ POTM ═══ */
.pm{position:absolute;top:50%;left:50%;width:800px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 10px 60px rgba(0,0,0,.7);text-align:center}
.pmh{background:linear-gradient(135deg,var(--gold),#D4A830);padding:22px}
.pmht{font-family:'Oswald';font-size:36px;font-weight:700;color:var(--bg-dark);text-transform:uppercase;letter-spacing:4px}
.pmb{padding:40px}
.pm-logo{width:70px;height:70px;margin:0 auto 10px}
.pm-logo img{width:70px;height:70px;object-fit:contain}
.pmnr{font-family:'Oswald';font-size:120px;font-weight:700;color:var(--gold);line-height:1}
.pmn{font-family:'Oswald';font-size:50px;font-weight:700;color:var(--white);margin:12px 0 6px;text-transform:uppercase}
.pmt{font-family:'Barlow';font-size:28px;color:var(--text-secondary);margin-bottom:26px}
.pms{display:flex;justify-content:center;gap:50px}
.pmsi{text-align:center}
.pmsv{font-family:'Oswald';font-size:48px;font-weight:700;color:var(--white)}
.pmsl{font-family:'Barlow';font-size:20px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

/* ═══ H2H ═══ */
.h2h{padding:14px 44px 22px}
.h2hr{display:grid;grid-template-columns:130px 1fr 180px 1fr 130px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.h2hv{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-align:center}
.h2hl{font-family:'Oswald';font-size:26px;font-weight:600;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:1px}
.h2hbar{height:26px;border-radius:5px;overflow:hidden;background:var(--row-even)}
.h2hfh{height:100%;background:linear-gradient(90deg,var(--bg-header),var(--teal-light));border-radius:5px 0 0 5px;float:left}
.h2hfa{height:100%;background:linear-gradient(90deg,var(--accent-dark),var(--accent));border-radius:0 5px 5px 0;float:right}

/* ═══ ROSTER ═══ */
.rost-title{padding:14px 44px 0;display:flex;align-items:center;gap:16px}
.rost-title img{width:50px;height:50px;object-fit:contain}
.rost-title span{font-family:'Oswald';font-size:44px;font-weight:700;color:var(--white);text-transform:uppercase}
.rost{padding:8px 44px 16px;overflow:hidden}
.rost table{width:100%;border-collapse:collapse}
.rost th{background:var(--bg-header);color:var(--white);padding:12px 10px;text-align:center;font-family:'Oswald';font-weight:600;font-size:24px;text-transform:uppercase}
.rost th:nth-child(2){text-align:left}
.rost td{padding:10px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);font-family:'Barlow Condensed';font-size:26px;color:var(--text-primary)}
.rost td:nth-child(2){text-align:left;font-weight:600}
.rost tr:nth-child(odd){background:var(--row-odd)}.rost tr:nth-child(even){background:var(--row-even)}
.rost .vp{color:var(--green);font-weight:700}.rost .vn{color:var(--accent);font-weight:700}
.rost .bold{font-weight:700;color:var(--gold);font-size:28px}
.rost .gk-tag{color:var(--gold);font-size:20px;font-weight:700}

/* ═══ GRAPH ═══ */
.graph-wrap{padding:14px 44px 22px}
.graph-canvas{position:relative;width:100%;height:520px;background:var(--bg-panel);border-radius:10px;border:1px solid var(--border);overflow:hidden}

/* ═══ PRE-MATCH ═══ */
.pre{position:absolute;top:50%;left:50%;width:1700px;max-height:1020px;background:var(--bg-dark);border-radius:14px;overflow:hidden;box-shadow:0 12px 80px rgba(0,0,0,.7)}
.pre-top{background:linear-gradient(90deg,var(--bg-header),var(--bg-header-light));padding:20px 50px;text-align:center}
.pre-comp{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:3px}
.pre-phase{font-family:'Barlow';font-size:24px;color:rgba(255,255,255,.7);margin-top:4px}
.pre-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:30px 60px;gap:40px}
.pre-team{text-align:center}
.pre-logo{width:130px;height:130px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.pre-logo img{max-width:120px;max-height:120px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.pre-tname{font-family:'Oswald';font-size:42px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:1px}
.pre-vsx{font-family:'Oswald';font-size:80px;font-weight:700;color:var(--accent);text-shadow:0 2px 20px rgba(204,51,51,.3)}
.pre-rosters{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--border)}
.pre-rcol{padding:16px 36px 20px}
.pre-rcol:first-child{border-right:1px solid var(--border)}
.pre-rhead{font-family:'Oswald';font-size:22px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.pre-rlist{columns:2;column-gap:20px}
.pre-pl{padding:4px 0;font-family:'Barlow Condensed';font-size:24px;color:var(--text-primary);break-inside:avoid;display:flex;gap:8px}
.pre-pn{font-family:'Oswald';font-size:23px;font-weight:600;color:var(--text-muted);min-width:34px;text-align:right}
.pre-pgk{color:var(--gold);font-weight:700;font-size:18px;margin-left:3px}
.pre-foot{display:flex;align-items:center;justify-content:center;gap:40px;padding:16px 50px;background:var(--bg-panel);border-top:1px solid var(--border)}
.pre-fi{display:flex;align-items:center;gap:10px;font-family:'Barlow';font-size:24px;color:var(--text-secondary)}
.pre-fi svg{width:22px;height:22px;fill:var(--text-muted)}
.pre-kick{font-family:'Oswald';font-size:32px;font-weight:700;color:var(--gold);animation:pulse 2s ease-in-out infinite}

#cs{position:fixed;top:4px;right:4px;font-size:10px;padding:3px 8px;border-radius:3px;z-index:9999}
#cs.ok{background:rgba(39,174,96,.2);color:#27AE60}
#cs.w{background:rgba(255,167,38,.2);color:#ffa726}
</style>
</head>
<body>
<div id="cs" class="w">Connecting...</div>
<div class="ov" id="ov"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FC={apiKey:"AIzaSyD2l1tmw1hVpv9dxrA-4DiYVjR0uPoADPM",authDomain:"handball-overlay.firebaseapp.com",databaseURL:"https://handball-overlay-default-rtdb.europe-west1.firebasedatabase.app",projectId:"handball-overlay",storageBucket:"handball-overlay.firebasestorage.app",messagingSenderId:"926258764",appId:"1:926258764:web:4435158617393fa0a5c6e9"};
const ROOM=new URLSearchParams(location.search).get('room')||'default';
let db,ref,M=null,LANG='en',cT=null;
try{firebase.initializeApp(FC);db=firebase.database();ref=db.ref('rooms/'+ROOM);document.getElementById('cs').textContent='Connected ✓';document.getElementById('cs').className='ok';setTimeout(()=>document.getElementById('cs').style.display='none',3000)}catch(e){document.getElementById('cs').textContent=e.message}

const T={
  en:{goal:'Goal',topScorers:'Top Scorers',gkDuel:'Goalkeeper Duel',shooting:'Shooting Breakdown',potm_m:'Player of the Match',potm_f:'Player of the Match',h2h:'Head to Head',roster:'Team Roster',graph:'Score Progression',prematch:'Coming Up Next',ht:'Halftime',ft:'Full Time',live:'Live',end:'End',sr:'Save Rate',sv:'saves',sh:'shots',eff:'Efficiency',gl:'Goals',rt:'Rating',s7m:'7m Penalty',s9m:'9m Backcourt',s6m:'6m Line',wing:'Wing',fb:'Fast Break',brk:'Breakthrough',ast:'Assists',trn:'Turnovers',stl:'Steals',sus:'2min Cards',savePct:'Save %',shotEff:'Shot Efficiency',kickoff:'Kickoff'},
  ro:{goal:'Gol',topScorers:'Golgheteri',gkDuel:'Duelul Portarilor',shooting:'Aruncări pe Zone',potm_m:'Jucătorul Meciului',potm_f:'Jucătoarea Meciului',h2h:'Față în Față',roster:'Componența Echipei',graph:'Evoluția Scorului',prematch:'Urmează',ht:'Pauză',ft:'Final',live:'Live',end:'Final',sr:'Procent Parade',sv:'parade',sh:'aruncări',eff:'Eficiență',gl:'Goluri',rt:'Rating',s7m:'7m Penalti',s9m:'9m Semicercul',s6m:'6m Linia',wing:'Extremă',fb:'Contraatac',brk:'Pătrundere',ast:'Pase Decisive',trn:'Pierderi',stl:'Recuperări',sus:'Eliminări 2min',savePct:'Procent Parade',shotEff:'Eficiență Aruncări',kickoff:'Start'}
};
function t(k){return T[LANG]?.[k]||T.en[k]||k}
function tPotm(){return t('potm_'+(M?.gender||'m'))}
function pga(s){if(!s)return{g:0,a:0,e:0};const p=s.split('/');const g=parseInt(p[0])||0,a=parseInt(p[1])||0;return{g,a,e:a>0?Math.round(g/a*100):0}}
function topS(pl,n=3){return pl.map(p=>({...p,...pga(p.ga)})).filter(p=>p.g>0).sort((a,b)=>b.g-a.g||b.e-a.e).slice(0,n)}
function bestP(){const all=[...M.home.players.map(p=>({...p,team:M.home.shortName,logo:M.home.logo})),...M.away.players.map(p=>({...p,team:M.away.shortName,logo:M.away.logo}))];return all.filter(p=>p.val!==''&&p.val!=null).sort((a,b)=>parseFloat(b.val)-parseFloat(a.val))[0]}
function szn(pl){const z={s7m:'s7m',s9m:'s9m',s6m:'s6m',wng:'wing',fb:'fb',brk:'brk'};const r={};for(const[k,lk]of Object.entries(z)){let g=0,a=0;pl.forEach(p=>{if(p[k]){const x=pga(p[k]);g+=x.g;a+=x.a}});r[lk]={g,a,e:a>0?Math.round(g/a*100):0}}return r}
function lg(url){return`<img src="${url}" style="object-fit:contain" onerror="this.style.display='none'">`}

const $=document.getElementById('ov');
function clr(){if(cT)clearTimeout(cT);$.innerHTML=''}
function apC(c){const s=document.documentElement.style;for(const[k,v]of Object.entries(c))s.setProperty('--'+k,v)}
function stL(){if(!M)return'';if(M.status==='End')return t('ft');if(M.time==='30:00')return t('ht');return M.time||t('live')}
function tbHtml(){return`<div class="tb"><div class="tside">${lg(M.home.logo)}<div class="tn">${M.home.shortName}</div></div><div class="ts">${M.home.score} : ${M.away.score}</div><div class="tside r"><div class="tn">${M.away.shortName}</div>${lg(M.away.logo)}</div></div>`}

function show(type,dur){
  if(!M)return;clr();
  const fn={prematch:rPre,h2h:rH2H,goalflash:rGF,topscorers:rTS,gkduel:rGKD,shooting:rSH,potm:rPM,roster1:()=>rRoster('home'),roster2:()=>rRoster('away'),graph:rGraph};
  if(fn[type])fn[type]();
  if(dur&&dur>0){cT=setTimeout(()=>{$.firstChild?.classList.add('ao');setTimeout(clr,400)},dur)}
}

// ═══ PRE-MATCH ═══
function rPre(){const h=M.home,a=M.away,hR=h.roster||[],aR=a.roster||[];const rL=l=>l.map(p=>`<div class="pre-pl"><span class="pre-pn">${p.num}</span><span>${p.name}${p.isGK?'<span class="pre-pgk"> GK</span>':''}</span></div>`).join('');$.innerHTML=`<div class="pre ac"><div class="pre-top"><div class="pre-comp">${M.competition||''}</div>${M.phase?`<div class="pre-phase">${M.phase}</div>`:''}</div><div class="pre-vs"><div class="pre-team"><div class="pre-logo"><img src="${h.logo}" onerror="this.parentElement.innerHTML='<div style=\\'font-size:60px;color:var(--bg-header-light)\\'>🤾</div>'"></div><div class="pre-tname">${h.name}</div></div><div class="pre-vsx">VS</div><div class="pre-team"><div class="pre-logo"><img src="${a.logo}" onerror="this.parentElement.innerHTML='<div style=\\'font-size:60px;color:var(--accent)\\'>🤾</div>'"></div><div class="pre-tname">${a.name}</div></div></div><div class="pre-rosters"><div class="pre-rcol"><div class="pre-rhead">${h.shortName}</div><div class="pre-rlist">${rL(hR)}</div></div><div class="pre-rcol"><div class="pre-rhead">${a.shortName}</div><div class="pre-rlist">${rL(aR)}</div></div></div><div class="pre-foot">${M.venue?`<div class="pre-fi"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${M.venue}${M.city?', '+M.city:''}</div>`:''} ${M.kickoff?`<div class="pre-fi"><div class="pre-kick">🕐 ${t('kickoff')}: ${M.kickoff}</div></div>`:''}</div></div>`}

// ═══ GOAL FLASH ═══
function rGF(){const lg2=M.lastGoal;if(!lg2){$.innerHTML=`<div class="gf au"><div class="gft">${t('goal')}</div><div class="gfp"><div class="gfnm" style="color:var(--text-muted)">No goals yet</div></div></div>`;return}$.innerHTML=`<div class="gf au"><div class="gft">${t('goal')}</div><div class="gfp"><div class="gfn">#${lg2.num}</div><div><div class="gfnm">${lg2.name}</div><div class="gfd">${lg2.team} · ${lg2.time}</div></div></div><div class="gfsc">${lg2.r1} : ${lg2.r2}</div></div>`}

// ═══ TOP SCORERS ═══
function rTS(){const hT=topS(M.home.players),aT=topS(M.away.players);const rows=arr=>arr.map(p=>`<div class="scr"><div class="scn">#${p.num}</div><div class="scnm">${p.name}</div><div class="scg">${p.g}/${p.a}</div><div class="sce">${p.e}%</div></div>`).join('');$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('topScorers')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="scs"><div class="scl"><img src="${M.home.logo}" style="width:30px;height:30px;object-fit:contain" onerror="this.style.display='none'">${M.home.shortName}</div>${rows(hT)}<div class="scl" style="margin-top:8px"><img src="${M.away.logo}" style="width:30px;height:30px;object-fit:contain" onerror="this.style.display='none'">${M.away.shortName}</div>${rows(aT)}</div></div>`}

// ═══ GK DUEL ═══
function rGKD(){function gkCard(gk,side){if(!gk)return'';const sv=pga(gk.sav);const pct=sv.a>0?Math.round(sv.g/sv.a*100):0;const zones=[{k:'gs7m',l:'7m'},{k:'gs9m',l:'9m'},{k:'gs6m',l:'6m'},{k:'gwng',l:'Wng'},{k:'gfb',l:'FB'}];const az=zones.filter(z=>gk[z.k]);return`<div class="gkc2"><div class="gkc2-pct">${sv.a>0?pct+'%':'-'}</div><div class="gkc2-info"><div class="gkc2-name">#${gk.num} ${gk.name}</div><div class="gkc2-det">${sv.a>0?sv.g+'/'+sv.a+' '+t('sv'):'0 '+t('sh')}</div></div>${az.length?`<div class="gkc2-bars">${az.map(z=>{const d=pga(gk[z.k]);const w=d.a>0?Math.round(d.g/d.a*100):0;return`<div class="gkb2"><div class="gkb2-l">${z.l}</div><div class="gkb2-track"><div class="gkb2-fill ${side}" style="width:${w}%"></div></div><div class="gkb2-v">${d.g}/${d.a}</div></div>`}).join('')}</div>`:''}</div>`}$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('gkDuel')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="gks"><div class="gks-grid"><div><div class="gks-col-label"><img src="${M.home.logo}" onerror="this.style.display='none'">${M.home.shortName}</div>${M.home.gk.map(g=>gkCard(g,'h')).join('')||'<div style="color:var(--text-muted);font-size:24px;padding:10px">N/A</div>'}</div><div><div class="gks-col-label"><img src="${M.away.logo}" onerror="this.style.display='none'">${M.away.shortName}</div>${M.away.gk.map(g=>gkCard(g,'a')).join('')||'<div style="color:var(--text-muted);font-size:24px;padding:10px">N/A</div>'}</div></div></div></div>`}

// ═══ SHOOTING ═══
function rSH(){const hZ=szn(M.home.players),aZ=szn(M.away.players);const zKeys=['s7m','s9m','s6m','wing','fb','brk'];const zR=(zones,side)=>zKeys.map(k=>{const d=zones[k]||{g:0,a:0,e:0};return`<div class="zr"><div class="zn">${t(k)}</div><div class="zb"><div class="zf ${side}" style="width:${d.e}%"></div></div><div class="zv">${d.g}/${d.a} · ${d.e}%</div></div>`}).join('');$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('shooting')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="shg"><div class="sht"><div class="shtn"><img src="${M.home.logo}" onerror="this.style.display='none'">${M.home.shortName}</div>${zR(hZ,'h')}</div><div class="sht"><div class="shtn"><img src="${M.away.logo}" onerror="this.style.display='none'">${M.away.shortName}</div>${zR(aZ,'a')}</div></div></div>`}

// ═══ POTM ═══
function rPM(){const b=bestP();if(!b)return;const{g,a,e}=pga(b.ga);$.innerHTML=`<div class="pm ac"><div class="pmh"><div class="pmht">${tPotm()}</div></div><div class="pmb"><div class="pm-logo"><img src="${b.logo}" onerror="this.style.display='none'"></div><div class="pmnr">#${b.num}</div><div class="pmn">${b.name}</div><div class="pmt">${b.team}</div><div class="pms">${g>0?`<div class="pmsi"><div class="pmsv">${g}/${a}</div><div class="pmsl">${t('gl')}</div></div><div class="pmsi"><div class="pmsv">${e}%</div><div class="pmsl">${t('eff')}</div></div>`:''}<div class="pmsi"><div class="pmsv" style="color:var(--green)">${b.val}</div><div class="pmsl">${t('rt')}</div></div></div></div></div>`}

// ═══ H2H ═══
function rH2H(){const h=M.home,a=M.away,ht=h.totals||{},at=a.totals||{},hg=h.gkTotals||{},ag=a.gkTotals||{};function row(label,hv,av,suffix=''){const total=(hv+av)||1;const hp=Math.round(hv/total*100),ap=100-hp;return`<div class="h2hr"><div class="h2hv">${hv}${suffix}</div><div class="h2hbar"><div class="h2hfh" style="width:${hp}%"></div></div><div class="h2hl">${label}</div><div class="h2hbar"><div class="h2hfa" style="width:${ap}%"></div></div><div class="h2hv">${av}${suffix}</div></div>`}$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('h2h')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="h2h">${row(t('gl'),ht.goals||0,at.goals||0)}${row(t('shotEff'),ht.eff||0,at.eff||0,'%')}${row(t('savePct'),hg.pct||0,ag.pct||0,'%')}${row(t('ast'),ht.ast||0,at.ast||0)}${row(t('trn'),ht.trn||0,at.trn||0)}${row(t('stl'),ht.stl||0,at.stl||0)}${row(t('sus'),ht.sus||0,at.sus||0)}</div></div>`}

// ═══ ROSTER ═══
function rRoster(side){const team=side==='home'?M.home:M.away;const allP=[...team.players,...team.gk].sort((a,b)=>a.num-b.num);$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('roster')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="rost-title"><img src="${team.logo}" onerror="this.style.display='none'"><span>${team.name}</span></div><div class="rost"><table><thead><tr><th>#</th><th>Player</th><th>G/A</th><th>7m</th><th>9m</th><th>6m</th><th>Wing</th><th>FB</th><th>Ast</th><th>2m</th><th>Val</th></tr></thead><tbody>${allP.map(p=>{const isGK=p.sav&&p.sav!=='';const ga=isGK?p.sav:p.ga;const val=isGK?p.gval:p.val;const vc=val!==''&&val!=null?(parseFloat(val)>=0?'vp':'vn'):'';return`<tr><td>${p.num}</td><td>${p.name}${isGK?' <span class="gk-tag">GK</span>':''}</td><td class="bold">${ga}</td><td>${isGK?p.gs7m:p.s7m}</td><td>${isGK?p.gs9m:p.s9m}</td><td>${isGK?p.gs6m:p.s6m}</td><td>${isGK?p.gwng:p.wng}</td><td>${isGK?p.gfb:p.fb}</td><td>${isGK?'':p.ast||''}</td><td>${isGK?'':p.sus||''}</td><td class="${vc}">${val!==''&&val!=null?val:''}</td></tr>`}).join('')}</tbody></table></div></div>`}

// ═══ GRAPH ═══
function rGraph(){const ev=M.goalEvents||[];if(!ev.length){$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('graph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div style="padding:60px;text-align:center;color:var(--text-muted);font-size:32px">No goal data</div></div>`;return}
const pts=[{sk:0,r1:0,r2:0}];ev.forEach(e=>pts.push({sk:e.sk,r1:e.r1,r2:e.r2,team:e.team}));
const maxG=Math.max(M.home.score,M.away.score,1);const lastSk=Math.max(pts[pts.length-1].sk,3600);
const W=1600,H=490,pL=70,pR=40,pT=40,pB=60,cW=W-pL-pR,cH=H-pT-pB;
function xp(sk){return pL+(sk/lastSk)*cW}function yp(g){return pT+cH-(g/maxG)*cH}
const hC='#4E8098',aC2='#CC3333';
let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:'Barlow Condensed',sans-serif">`;
for(let i=0;i<=maxG;i++){const yy=yp(i);svg+=`<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="rgba(255,255,255,.06)"/><text x="${pL-14}" y="${yy+7}" fill="#6A8090" font-size="22" text-anchor="end" font-weight="600">${i}</text>`}
[0,5,10,15,20,25,30,35,40,45,50,55,60].forEach(m=>{const sk2=m*60;if(sk2>lastSk)return;const xx=xp(sk2);svg+=`<line x1="${xx}" y1="${pT}" x2="${xx}" y2="${H-pB}" stroke="rgba(255,255,255,.04)"/><text x="${xx}" y="${H-pB+28}" fill="#6A8090" font-size="22" text-anchor="middle" font-weight="600">${m}'</text>`});
const htX=xp(1800);svg+=`<line x1="${htX}" y1="${pT}" x2="${htX}" y2="${H-pB}" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="8,4"/><text x="${htX}" y="${pT-12}" fill="rgba(255,255,255,.5)" font-size="22" text-anchor="middle" font-weight="700">HT</text>`;
let pH='',pA2='';pts.forEach((p,i)=>{const c=i===0?'M':'L';pH+=`${c}${xp(p.sk).toFixed(1)},${yp(p.r1).toFixed(1)} `;pA2+=`${c}${xp(p.sk).toFixed(1)},${yp(p.r2).toFixed(1)} `});
svg+=`<path d="${pH}" fill="none" stroke="${hC}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="${pA2}" fill="none" stroke="${aC2}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
pts.forEach((p,i)=>{if(i===0)return;if(p.team===1)svg+=`<circle cx="${xp(p.sk).toFixed(1)}" cy="${yp(p.r1).toFixed(1)}" r="6" fill="${hC}" stroke="#fff" stroke-width="2.5"/>`;else svg+=`<circle cx="${xp(p.sk).toFixed(1)}" cy="${yp(p.r2).toFixed(1)}" r="6" fill="${aC2}" stroke="#fff" stroke-width="2.5"/>`});
svg+=`<rect x="${pL+14}" y="${pT+8}" width="20" height="5" rx="2" fill="${hC}"/><text x="${pL+40}" y="${pT+16}" fill="#F0F4F7" font-size="22" font-weight="700">${M.home.shortName}</text>`;
const lw=M.home.shortName.length*12+60;svg+=`<rect x="${pL+lw}" y="${pT+8}" width="20" height="5" rx="2" fill="${aC2}"/><text x="${pL+lw+26}" y="${pT+16}" fill="#F0F4F7" font-size="22" font-weight="700">${M.away.shortName}</text>`;
svg+=`</svg>`;
$.innerHTML=`<div class="sp ac"><div class="sph"><div class="spt">${t('graph')}</div><div class="spu">${stL()}</div></div>${tbHtml()}<div class="graph-wrap"><div class="graph-canvas">${svg}</div></div></div>`}

// ═══ FIREBASE ═══
if(ref){
  ref.child('command').on('value',s=>{const v=s.val();if(!v)return;if(v.type==='show')show(v.overlay,v.duration||0);if(v.type==='clear')clr()});
  ref.child('match').on('value',s=>{const v=s.val();if(v)M=v});
  ref.child('lang').on('value',s=>{const v=s.val();if(v)LANG=v});
  ref.child('colors').on('value',s=>{const v=s.val();if(v)apC(v)});
}
</script>
</body>
