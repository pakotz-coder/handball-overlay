<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Handball Overlay Output</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-dark:#1A2D3D;--bg-panel:#1E3448;--bg-header:#2B5876;--bg-header-light:#4E8098;
  --accent:#CC3333;--accent-bright:#E74C3C;--accent-dark:#A02020;
  --teal:#3A5A6A;--teal-light:#4A7A8A;--green:#27AE60;--gold:#F0C040;--white:#FFFFFF;
  --text-primary:#F0F4F7;--text-secondary:#9AABB8;--text-muted:#6A8090;
  --border:#2A4A5A;--row-even:#1A3040;--row-odd:#1E3A4C;--score-bg:#0E1E2A;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed',sans-serif}
.overlay{position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:translate(-50%,-50%) scale(.92);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.anim-up{animation:slideUp .45s cubic-bezier(.22,1,.36,1) forwards}
.anim-fade{animation:fadeIn .5s ease forwards}
.anim-center{animation:scaleIn .45s cubic-bezier(.22,1,.36,1) forwards}
.anim-out{animation:fadeOut .35s ease forwards}

/* SCOREBUG */
.scorebug{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;height:72px;border-radius:6px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.55)}
.sb-team{display:flex;align-items:center;gap:12px;padding:0 22px;min-width:290px;background:linear-gradient(135deg,var(--bg-header),var(--bg-header-light))}
.sb-team.away{background:linear-gradient(135deg,var(--bg-header-light),var(--bg-header))}
.sb-logo{width:42px;height:42px;border-radius:4px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-logo img{width:38px;height:38px;object-fit:contain}
.sb-name{font-family:'Oswald',sans-serif;font-size:21px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:.4px}
.sb-score{display:flex;align-items:center;background:var(--score-bg);padding:0 6px}
.sb-num{font-family:'Oswald',sans-serif;font-size:46px;font-weight:700;color:var(--white);width:56px;text-align:center;line-height:1}
.sb-sep{font-family:'Oswald',sans-serif;font-size:34px;color:var(--text-muted);margin:0 2px}
.sb-time{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;background:var(--accent);min-width:76px}
.sb-time-val{font-family:'Oswald',sans-serif;font-size:23px;font-weight:700;color:var(--white)}
.sb-time-lbl{font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px}

/* STAT PANEL */
.stat-panel{position:absolute;top:50%;left:50%;width:1100px;background:var(--bg-dark);border-radius:8px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.sp-header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--accent),var(--accent-dark));padding:13px 28px}
.sp-title{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--white);text-transform:uppercase;letter-spacing:2px}
.sp-sub{font-size:13px;color:rgba(255,255,255,.75)}
.teams-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 28px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
.tb-name{font-family:'Oswald',sans-serif;font-size:21px;font-weight:600;color:var(--text-primary);text-transform:uppercase}
.tb-name.r{text-align:right}
.tb-score{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;color:var(--white);text-align:center;background:var(--score-bg);border-radius:6px;padding:4px 22px}

/* TOP SCORERS */
.sc-section{padding:0 28px 16px}
.sc-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;padding:10px 0 5px}
.sc-row{display:grid;grid-template-columns:34px 1fr 68px 54px;align-items:center;padding:7px 10px;border-radius:3px;margin-bottom:2px}
.sc-row:nth-child(odd){background:var(--row-odd)}.sc-row:nth-child(even){background:var(--row-even)}
.sc-num{font-size:13px;font-weight:700;color:var(--text-muted);text-align:center;font-family:'Barlow',sans-serif}
.sc-name{font-size:14.5px;color:var(--text-primary)}
.sc-goals{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;color:var(--gold);text-align:center}
.sc-eff{font-family:'Barlow',sans-serif;font-size:12.5px;color:var(--text-secondary);text-align:center}

/* GK DUEL */
.gk-section{padding:16px 28px}
.gk-team-label{font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.gk-card{display:flex;gap:16px;margin-bottom:14px;padding:10px;background:var(--bg-panel);border-radius:6px;border:1px solid var(--border)}
.gk-big{text-align:center;min-width:80px}
.gk-pct{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--green)}
.gk-pct-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.gk-detail{flex:1}
.gk-n{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.gk-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.gk-bar-lbl{font-size:12px;color:var(--text-secondary);width:44px;text-align:right}
.gk-bar-track{flex:1;height:18px;background:var(--row-even);border-radius:3px;overflow:hidden}
.gk-bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:10px;font-weight:700;color:var(--white);transition:width .7s ease}
.gk-bar-fill.home{background:linear-gradient(90deg,var(--bg-header),var(--teal-light))}
.gk-bar-fill.away{background:linear-gradient(90deg,var(--accent-dark),var(--accent))}

/* SHOOTING */
.shoot-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 28px}
.shoot-team{background:var(--bg-panel);border-radius:6px;padding:12px;border:1px solid var(--border)}
.shoot-tn{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.z-row{display:grid;grid-template-columns:56px 1fr 80px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.z-name{font-size:12.5px;color:var(--text-secondary)}
.z-bar{height:15px;background:var(--row-even);border-radius:2px;overflow:hidden}
.z-fill{height:100%;border-radius:2px;min-width:2px;transition:width .6s ease}
.z-fill.home{background:var(--bg-header-light)}.z-fill.away{background:var(--accent)}
.z-val{font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:700;color:var(--text-primary);text-align:right}

/* POTM */
.potm{position:absolute;top:50%;left:50%;width:580px;background:var(--bg-dark);border-radius:8px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.6);text-align:center}
.potm-hdr{background:linear-gradient(135deg,var(--gold),#D4A830);padding:13px}
.potm-hdr-t{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--bg-dark);text-transform:uppercase;letter-spacing:3px}
.potm-body{padding:24px}
.potm-nr{font-family:'Oswald',sans-serif;font-size:66px;font-weight:700;color:var(--gold);line-height:1}
.potm-name{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;color:var(--white);margin:6px 0 3px;text-transform:uppercase}
.potm-team{font-size:14px;color:var(--text-secondary);margin-bottom:14px}
.potm-stats{display:flex;justify-content:center;gap:24px}
.potm-s{text-align:center}
.potm-sv{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--white)}
.potm-sl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

/* GOAL FLASH */
.goal-flash{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;height:62px;border-radius:6px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.gf-tag{background:var(--accent);display:flex;align-items:center;padding:0 18px;font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:2px}
.gf-player{background:var(--bg-dark);display:flex;align-items:center;gap:10px;padding:0 20px}
.gf-nr{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--gold)}
.gf-name{font-size:17px;color:var(--text-primary)}
.gf-det{font-family:'Barlow',sans-serif;font-size:12px;color:var(--text-secondary)}
.gf-sc{background:var(--score-bg);display:flex;align-items:center;padding:0 18px;font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--white)}

#conn-status{position:fixed;top:4px;right:4px;font-size:10px;padding:3px 8px;border-radius:3px;font-family:'Barlow',sans-serif;z-index:9999}
#conn-status.ok{background:rgba(39,174,96,.2);color:#27AE60}
#conn-status.waiting{background:rgba(255,167,38,.2);color:#ffa726}
#conn-status.err{background:rgba(204,51,51,.2);color:#CC3333}
</style>
</head>
<body>
<div id="conn-status" class="waiting">Connecting...</div>
<div class="overlay" id="overlay"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ═══ FIREBASE CONFIG ═══
// REPLACE THIS with your Firebase config (see setup guide)
const firebaseConfig = {
  apiKey: "AIzaSyD2l1tmw1hVpv9dxrA-4DiYVjR0uPoADPM",
  authDomain: "handball-overlay.firebaseapp.com",
  databaseURL: "https://handball-overlay-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "handball-overlay",
  storageBucket: "handball-overlay.firebasestorage.app",
  messagingSenderId: "926258764",
  appId: "1:926258764:web:4435158617393fa0a5c6e9"
};

// Get room ID from URL params (e.g., output.html?room=my-match-1)
const urlParams = new URLSearchParams(window.location.search);
const ROOM = urlParams.get('room') || 'default';

// ═══ INIT FIREBASE ═══
let db, roomRef;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  roomRef = db.ref('rooms/' + ROOM);
  document.getElementById('conn-status').textContent = 'Connected ✓';
  document.getElementById('conn-status').className = 'ok';
  // Hide status after 3 seconds
  setTimeout(() => { document.getElementById('conn-status').style.display = 'none'; }, 3000);
} catch(e) {
  document.getElementById('conn-status').textContent = 'Firebase error: ' + e.message;
  document.getElementById('conn-status').className = 'err';
}

let MATCH = null;
let LANG = 'en';
let currentTimeout = null;

const T = {
  en:{goal:'Goal',topScorers:'Top Scorers',gkDuel:'Goalkeeper Duel',shooting:'Shooting Breakdown',potm:'Player of the Match',halftime:'Halftime',fulltime:'Full Time',live:'Live',end:'End',saveRate:'Save Rate',saves:'saves',shots:'shots',efficiency:'Efficiency',goals:'Goals',rating:'Rating',s7m:'7m',s9m:'9m',s6m:'6m',wing:'Wing',fb:'Fast Break'},
  ro:{goal:'Gol',topScorers:'Golgheteri',gkDuel:'Duelul Portarilor',shooting:'Aruncări pe Zone',potm:'Jucătoarea Meciului',halftime:'Pauză',fulltime:'Final',live:'Live',end:'Final',saveRate:'Proc. Parade',saves:'parade',shots:'aruncări',efficiency:'Eficiență',goals:'Goluri',rating:'Rating',s7m:'7m',s9m:'9m',s6m:'6m',wing:'Extremă',fb:'Contraatac'}
};
function t(k){return T[LANG]?.[k]||T.en[k]||k}
function parseGA(ga){if(!ga)return{g:0,a:0,e:0};const p=ga.split('/');const g=parseInt(p[0])||0,a=parseInt(p[1])||0;return{g,a,e:a>0?Math.round(g/a*100):0}}
function topScorers(pl,n=3){return pl.map(p=>({...p,...parseGA(p.ga)})).filter(p=>p.g>0).sort((a,b)=>b.g-a.g||b.e-a.e).slice(0,n)}
function bestPlayer(){const all=[...MATCH.home.players.map(p=>({...p,team:MATCH.home.shortName})),...MATCH.away.players.map(p=>({...p,team:MATCH.away.shortName}))];return all.filter(p=>p.val&&p.val!=='').sort((a,b)=>parseFloat(b.val)-parseFloat(a.val))[0]}
function shootByZone(pl){const zones={s7m:'s7m',s9m:'s9m',s6m:'s6m',wng:'wing',fb:'fb'};const r={};for(const[k,lk]of Object.entries(zones)){let g=0,a=0;pl.forEach(p=>{if(p[k]){const x=parseGA(p[k]);g+=x.g;a+=x.a}});r[lk]={g,a,e:a>0?Math.round(g/a*100):0}}return r}

const $o=document.getElementById('overlay');
function clear(){if(currentTimeout)clearTimeout(currentTimeout);$o.innerHTML=''}
function applyColors(c){const s=document.documentElement.style;for(const[k,v]of Object.entries(c))s.setProperty('--'+k,v)}
function statusLabel(){if(!MATCH)return'';if(MATCH.status==='End')return t('fulltime');if(MATCH.time==='30:00')return t('halftime');return MATCH.time||t('live')}

function show(type,duration){
  if(!MATCH)return;clear();
  const fn={scorebug:rScoreBug,goalflash:rGoalFlash,topscorers:rTopScorers,gkduel:rGKDuel,shooting:rShooting,potm:rPOTM};
  if(fn[type])fn[type]();
  if(duration&&duration>0){currentTimeout=setTimeout(()=>{$o.firstChild?.classList.add('anim-out');setTimeout(clear,400)},duration)}
}

function rScoreBug(){const h=MATCH.home,a=MATCH.away;$o.innerHTML=`<div class="scorebug anim-up"><div class="sb-team home"><div class="sb-logo">${h.logo?`<img src="${h.logo}">`:`<span style="font-size:18px;color:#fff;font-weight:700">${h.shortName[0]}</span>`}</div><div class="sb-name">${h.shortName}</div></div><div class="sb-score"><div class="sb-num">${h.score}</div><div class="sb-sep">:</div><div class="sb-num">${a.score}</div></div><div class="sb-team away"><div class="sb-name">${a.shortName}</div><div class="sb-logo">${a.logo?`<img src="${a.logo}">`:`<span style="font-size:18px;color:#fff;font-weight:700">${a.shortName[0]}</span>`}</div></div><div class="sb-time"><div class="sb-time-val">${MATCH.time||''}</div><div class="sb-time-lbl">${MATCH.status==='End'?t('end'):t('live')}</div></div></div>`}

function rGoalFlash(){const scorer=MATCH._lastGoalScorer||MATCH.home.players.find(p=>parseGA(p.ga).g>0);if(!scorer)return;const{g,a,e}=parseGA(scorer.ga);const team=MATCH._lastGoalTeam||MATCH.home.shortName;$o.innerHTML=`<div class="goal-flash anim-up"><div class="gf-tag">${t('goal')}</div><div class="gf-player"><div class="gf-nr">#${scorer.num}</div><div><div class="gf-name">${scorer.name}</div><div class="gf-det">${team} · ${g}/${a} (${e}%)</div></div></div><div class="gf-sc">${MATCH.home.score} : ${MATCH.away.score}</div></div>`}

function rTopScorers(){const hT=topScorers(MATCH.home.players),aT=topScorers(MATCH.away.players);const rows=arr=>arr.map(p=>`<div class="sc-row"><div class="sc-num">${p.num}</div><div class="sc-name">${p.name}</div><div class="sc-goals">${p.g}/${p.a}</div><div class="sc-eff">${p.e}%</div></div>`).join('');$o.innerHTML=`<div class="stat-panel anim-center"><div class="sp-header"><div class="sp-title">${t('topScorers')}</div><div class="sp-sub">${statusLabel()}</div></div><div class="teams-bar"><div class="tb-name">${MATCH.home.shortName}</div><div class="tb-score">${MATCH.home.score} : ${MATCH.away.score}</div><div class="tb-name r">${MATCH.away.shortName}</div></div><div class="sc-section"><div class="sc-label">${MATCH.home.shortName}</div>${rows(hT)}<div class="sc-label" style="margin-top:6px">${MATCH.away.shortName}</div>${rows(aT)}</div></div>`}

function rGKDuel(){function card(gk,side){if(!gk)return`<div style="padding:14px;color:var(--text-muted)">N/A</div>`;const sv=parseGA(gk.sav);const pct=sv.a>0?Math.round(sv.g/sv.a*100):0;const zones=[{k:'s7m',l:t('s7m')},{k:'s9m',l:t('s9m')},{k:'s6m',l:t('s6m')},{k:'wng',l:t('wing')},{k:'fb',l:t('fb')}];return`<div class="gk-card"><div class="gk-big"><div class="gk-pct">${pct}%</div><div class="gk-pct-label">${t('saveRate')}</div></div><div class="gk-detail"><div class="gk-n">#${gk.num} ${gk.name}</div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:5px">${sv.g} ${t('saves')} / ${sv.a} ${t('shots')}</div>${zones.filter(z=>gk[z.k]).map(z=>{const d=parseGA(gk[z.k]);const w=d.a>0?Math.round(d.g/d.a*100):0;return`<div class="gk-bar-row"><div class="gk-bar-lbl">${z.l}</div><div class="gk-bar-track"><div class="gk-bar-fill ${side}" style="width:${w}%">${d.g}/${d.a}</div></div></div>`}).join('')}</div></div>`}$o.innerHTML=`<div class="stat-panel anim-center"><div class="sp-header"><div class="sp-title">${t('gkDuel')}</div><div class="sp-sub">${statusLabel()}</div></div><div class="teams-bar"><div class="tb-name">${MATCH.home.shortName}</div><div class="tb-score">${MATCH.home.score} : ${MATCH.away.score}</div><div class="tb-name r">${MATCH.away.shortName}</div></div><div class="gk-section"><div class="gk-team-label">${MATCH.home.shortName}</div>${MATCH.home.gk.map(g=>card(g,'home')).join('')}<div class="gk-team-label" style="margin-top:10px">${MATCH.away.shortName}</div>${MATCH.away.gk.length?MATCH.away.gk.map(g=>card(g,'away')).join(''):'<div style="padding:10px;color:var(--text-muted)">N/A</div>'}</div></div>`}

function rShooting(){const hZ=shootByZone(MATCH.home.players),aZ=shootByZone(MATCH.away.players);const zKeys=['s7m','s9m','s6m','wing','fb'];const zR=(zones,side)=>zKeys.map(k=>{const d=zones[k]||{g:0,a:0,e:0};return`<div class="z-row"><div class="z-name">${t(k)}</div><div class="z-bar"><div class="z-fill ${side}" style="width:${d.e}%"></div></div><div class="z-val">${d.g}/${d.a} (${d.e}%)</div></div>`}).join('');$o.innerHTML=`<div class="stat-panel anim-center"><div class="sp-header"><div class="sp-title">${t('shooting')}</div><div class="sp-sub">${statusLabel()}</div></div><div class="teams-bar"><div class="tb-name">${MATCH.home.shortName}</div><div class="tb-score">${MATCH.home.score} : ${MATCH.away.score}</div><div class="tb-name r">${MATCH.away.shortName}</div></div><div class="shoot-grid"><div class="shoot-team"><div class="shoot-tn">${MATCH.home.shortName}</div>${zR(hZ,'home')}</div><div class="shoot-team"><div class="shoot-tn">${MATCH.away.shortName}</div>${zR(aZ,'away')}</div></div></div>`}

function rPOTM(){const best=bestPlayer();if(!best)return;const{g,a,e}=parseGA(best.ga);$o.innerHTML=`<div class="potm anim-center"><div class="potm-hdr"><div class="potm-hdr-t">${t('potm')}</div></div><div class="potm-body"><div class="potm-nr">#${best.num}</div><div class="potm-name">${best.name}</div><div class="potm-team">${best.team}</div><div class="potm-stats">${g>0?`<div class="potm-s"><div class="potm-sv">${g}/${a}</div><div class="potm-sl">${t('goals')}</div></div><div class="potm-s"><div class="potm-sv">${e}%</div><div class="potm-sl">${t('efficiency')}</div></div>`:''}<div class="potm-s"><div class="potm-sv" style="color:var(--green)">${best.val}</div><div class="potm-sl">${t('rating')}</div></div></div></div></div>`}

// ═══ LISTEN TO FIREBASE ═══
if(roomRef){
  // Listen for commands
  roomRef.child('command').on('value', snap => {
    const val = snap.val();
    if(!val) return;
    if(val.type === 'show') show(val.overlay, val.duration || 0);
    if(val.type === 'clear') clear();
  });

  // Listen for match data
  roomRef.child('match').on('value', snap => {
    const val = snap.val();
    if(val) MATCH = val;
  });

  // Listen for language
  roomRef.child('lang').on('value', snap => {
    const val = snap.val();
    if(val) LANG = val;
  });

  // Listen for colors
  roomRef.child('colors').on('value', snap => {
    const val = snap.val();
    if(val) applyColors(val);
  });
}
</script>
</body>
</html>
